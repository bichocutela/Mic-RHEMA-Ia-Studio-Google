          rep('        "midia" to "Conteúdo IBR",\n        "cursos" to "Módulos IBR",\n        "certificados" to "Certificados IBR"',
              '        "midia" to "Conteúdo",\n        "cursos" to "Módulos",\n        "certificados" to "Certificados"', 'nomes curtos das abas')

          start = text.index('        BoxWithConstraints(\n            modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 8.dp)\n        ) {')
          end_marker = '\n\n        Box(modifier = Modifier.weight(1f).fillMaxWidth()) {'
          end = text.index(end_marker, start)
          new_tabs = '''        Row(\n            modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp).horizontalScroll(rememberScrollState()),\n            horizontalArrangement = Arrangement.spacedBy(8.dp)\n        ) {\n            tabs.forEach { (id, title) ->\n                FilterChip(\n                    selected = vipTab == id,\n                    onClick = { vipTab = id },\n                    label = { Text(title, maxLines = 1) }\n                )\n            }\n        }'''
          text = text[:start] + new_tabs + text[end:]

          rep('    var isDeleting by remember { mutableStateOf(false) }\n\n    Column(modifier = Modifier.padding(16.dp).imePadding().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(16.dp)) {',
              '    var isDeleting by remember { mutableStateOf(false) }\n    var contentFilter by remember { mutableStateOf("Todos") }\n    var addContentType by remember { mutableStateOf<String?>(null) }\n\n    Column(modifier = Modifier.padding(16.dp).imePadding().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(12.dp)) {', 'estados conteúdo')

          rep('        Text("Adicione e edite livros, áudios e vídeos para os alunos do Instituto Bíblico Rhema.", style = MaterialTheme.typography.bodyMedium)\n        // SMART IMPORTER',
              '''        Text("Adicione e edite os materiais dos alunos sem sair desta tela.", style = MaterialTheme.typography.bodyMedium)\n        Row(modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            listOf("Todos", "Livros", "Áudios", "Vídeos", "Fotos").forEach { option ->\n                FilterChip(selected = contentFilter == option, onClick = { contentFilter = option }, label = { Text(option) })\n            }\n        }\n        Row(modifier = Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            listOf("Livros" to "+ Livro", "Áudios" to "+ Áudio", "Vídeos" to "+ Vídeo", "Fotos" to "+ Álbum").forEach { (type, label) ->\n                AssistChip(onClick = { addContentType = if (addContentType == type) null else type }, label = { Text(label) })\n            }\n        }\n        // SMART IMPORTER''', 'filtros conteúdo')

          rep('PDF, Word (DOCX), Áudio (MP3), Vídeo (MP4) ou Imagem.', 'PDF, EPUB, Word (DOCX), Áudio (MP3), Vídeo (MP4) ou Imagem.', 'texto EPUB')
          rep('                                GoogleDriveService.FileType.WORD -> {',
              '''                                GoogleDriveService.FileType.EPUB -> {\n                                    smartMessage = "Livro EPUB detectado e adicionado!"\n                                    addVipBook(ContentBook(id = System.currentTimeMillis().toString(), title = "Novo Livro EPUB Importado", author = "Documento EPUB", coverUrl = "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=500&q=80", contentText = "", bookUrl = GoogleDriveService.getDirectDownloadLink(smartUrl), type = "epub"))\n                                }\n                                GoogleDriveService.FileType.WORD -> {''', 'smart import EPUB')

          # Formulários de conteúdo aparecem somente quando solicitados; listas continuam usando o código antigo.
          rep('        // ADD BOOK\n        Card(modifier = Modifier.fillMaxWidth()) {', '        // ADD BOOK\n        if (addContentType == "Livros") {\n        Card(modifier = Modifier.fillMaxWidth()) {', 'abrir formulário livro')
          rep('        }\n        \n        if (vipBooksState.isNotEmpty()) {', '        }\n        }\n        \n        if ((contentFilter == "Todos" || contentFilter == "Livros") && vipBooksState.isNotEmpty()) {', 'fechar formulário livro')

          rep('        // ADD AUDIO\n        Card(modifier = Modifier.fillMaxWidth()) {', '        // ADD AUDIO\n        if (addContentType == "Áudios") {\n        Card(modifier = Modifier.fillMaxWidth()) {', 'abrir formulário áudio')
          rep('        }\n        \n        if (vipAudiosState.isNotEmpty()) {', '        }\n        }\n        \n        if ((contentFilter == "Todos" || contentFilter == "Áudios") && vipAudiosState.isNotEmpty()) {', 'fechar formulário áudio')

          rep('        // ADD VIDEO\n        Card(modifier = Modifier.fillMaxWidth()) {', '        // ADD VIDEO\n        if (addContentType == "Vídeos") {\n        Card(modifier = Modifier.fillMaxWidth()) {', 'abrir formulário vídeo')
          rep('        }\n        \n        if (vipVideosState.isNotEmpty()) {', '        }\n        }\n        \n        if ((contentFilter == "Todos" || contentFilter == "Vídeos") && vipVideosState.isNotEmpty()) {', 'fechar formulário vídeo')

          rep('        // ADD ALBUM\n        Card(modifier = Modifier.fillMaxWidth()) {', '        // ADD ALBUM\n        if (addContentType == "Fotos") {\n        Card(modifier = Modifier.fillMaxWidth()) {', 'abrir formulário álbum')
          rep('        }\n        \n        if (vipAlbumsState.isNotEmpty()) {', '        }\n        }\n        \n        if ((contentFilter == "Todos" || contentFilter == "Fotos") && vipAlbumsState.isNotEmpty()) {', 'fechar formulário álbum')

          marker = 'fun EditVipIbrSection() {'
          head, section = text.split(marker, 1)
          section = marker + section
          def srep(old, new, label):
              global section
              if old not in section:
                  raise SystemExit(f'Bloco 3 módulos não encontrou: {label}')
              section = section.replace(old, new, 1)

          srep('    var courseImageUrl by remember { mutableStateOf("") }',
               '    var courseImageUrl by remember { mutableStateOf("") }\n    var showCreateCourseForm by remember { mutableStateOf(false) }\n    var showAddChapterForm by remember { mutableStateOf(false) }\n    var expandedCourseIds by remember { mutableStateOf(setOf<String>()) }', 'estados compactos')

          srep('                    text = "Cadastre novos cursos teológicos, capítulos, links do YouTube, vídeos e áudios",',
               '                    text = "Cursos e aulas do IBR, organizados de forma simples.",', 'subtítulo módulos')
          srep('                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n            }\n        }\n\n        // 1. CREATE NEW COURSE CARD',
               '''                    color = MaterialTheme.colorScheme.onSurfaceVariant\n                )\n                Spacer(Modifier.height(10.dp))\n                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                    OutlinedButton(\n                        onClick = { showCreateCourseForm = !showCreateCourseForm; if (showCreateCourseForm) showAddChapterForm = false },\n                        modifier = Modifier.weight(1f)\n                    ) { Text(if (showCreateCourseForm) "Fechar" else "+ Curso") }\n                    Button(\n                        onClick = { showAddChapterForm = !showAddChapterForm; if (showAddChapterForm) showCreateCourseForm = false },\n                        modifier = Modifier.weight(1f),\n                        enabled = ibrCoursesState.isNotEmpty()\n                    ) { Text(if (showAddChapterForm) "Fechar" else "+ Aula") }\n                }\n            }\n        }\n\n        // 1. CREATE NEW COURSE CARD''', 'botões rápidos')

          srep('        item {\n            Card(\n                modifier = Modifier.fillMaxWidth(),\n                shape = RoundedCornerShape(32.dp),',
               '        if (showCreateCourseForm) {\n        item {\n            Card(\n                modifier = Modifier.fillMaxWidth(),\n                shape = RoundedCornerShape(18.dp),', 'mostrar formulário curso')
          srep('                }\n            }\n        }\n\n        // 2. ADD CHAPTER CARD',
               '                }\n            }\n        }\n        }\n\n        // 2. ADD CHAPTER CARD', 'fechar formulário curso')
          srep('        if (ibrCoursesState.isNotEmpty()) {', '        if (ibrCoursesState.isNotEmpty() && showAddChapterForm) {', 'mostrar formulário aula')
          srep('                    shape = RoundedCornerShape(32.dp),\n                    border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)',
               '                    shape = RoundedCornerShape(18.dp),\n                    border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)', 'shape formulário aula')

          srep('            items(visibleCourses) { course ->\n                Card(',
               '            items(visibleCourses) { course ->\n                val expanded = expandedCourseIds.contains(course.id)\n                Card(', 'estado expandido')
          srep('                    shape = RoundedCornerShape(32.dp),', '                    shape = RoundedCornerShape(18.dp),', 'shape curso')
          srep('                            Row {\n                                IconButton(onClick = { editingCourse = course }) {',
               '''                            Row {\n                                IconButton(onClick = {\n                                    expandedCourseIds = if (expanded) expandedCourseIds - course.id else expandedCourseIds + course.id\n                                }) {\n                                    Icon(if (expanded) Icons.Default.KeyboardArrowUp else Icons.Default.KeyboardArrowDown, contentDescription = if (expanded) "Recolher" else "Abrir")\n                                }\n                                IconButton(onClick = { editingCourse = course }) {''', 'botão expandir')
          srep('                                Text(course.title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)\n                            }',
               '                                Text(course.title, style = MaterialTheme.typography.titleMedium, fontWeight = FontWeight.Bold)\n                                Text("${course.chapters.size} aula(s) • ${course.chapters.sumOf { it.durationMinutes }} min", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                            }', 'resumo curso')
          srep('                        Text(course.description, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        \n                        Divider(modifier = Modifier.padding(vertical = 8.dp))',
               '                        if (expanded) {\n                        Text(course.description, style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        \n                        Divider(modifier = Modifier.padding(vertical = 8.dp))', 'abrir detalhes curso')
          # Fecha o bloco expanded logo após a lista de aulas, antes de fechar a coluna do card.
          needle = '''                            }\n                        }\n                    }\n                }\n            }\n        }\n\n    }'''
          replacement = '''                            }\n                        }\n                        }\n                    }\n                }\n            }\n        }\n\n    }'''
          if needle not in section:
              raise SystemExit('Bloco 3 módulos não encontrou fechamento dos detalhes')
          section = section.replace(needle, replacement, 1)

          section = section.replace('                                courseImageUrl = ""', '                                courseImageUrl = ""\n                                showCreateCourseForm = false', 1)
          section = section.replace('                                    isYoutube = false', '                                    isYoutube = false\n                                    showAddChapterForm = false', 1)

          text = head + section
          path.write_text(text, encoding='utf-8')
          PY

      - name: Testar bloco 3 com APK completo
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Salvar bloco 3
        run: |
          git add app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git commit -m "ui: deixar painel IBR mais simples e compacto"

      - name: Remover workflow temporário e publicar branch
        run: |
          rm -f app/google-services.json .env release.keystore
          git rm .github/workflows/ibr-admin-simple-blocks.yml
          git commit -m "chore: remover validação temporária do IBR"
          git push origin HEAD:feat/ibr-admin-simple-cleanup

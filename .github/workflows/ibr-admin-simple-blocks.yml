name: Validar limpeza simples do IBR

on:
  push:
    branches:
      - 'feat/ibr-admin-simple-cleanup'
    paths:
      - '.github/workflows/ibr-admin-simple-blocks.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: feat/ibr-admin-simple-cleanup
          fetch-depth: 0

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar configuração de build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi
          echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bloco 1 — aulas e edições
        run: python3 scripts/ibr_admin_simple_patch.py 1

      - name: Testar bloco 1
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: ./gradlew compileReleaseKotlin --no-daemon --stacktrace

      - name: Salvar bloco 1
        run: |
          git add app/src/main/java/com/aistudio/micrhema/VipAdmin.kt app/src/main/java/com/aistudio/micrhema/IbrAdminSimpleHelpers.kt
          git commit -m "fix: simplificar edição de cursos e aulas IBR"

      - name: Bloco 2 — certificados por aluno
        run: python3 scripts/ibr_admin_simple_patch.py 2

      - name: Testar bloco 2
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: ./gradlew compileReleaseKotlin --no-daemon --stacktrace

      - name: Salvar bloco 2
        run: |
          git add app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git commit -m "fix: usar progresso individual nos certificados IBR"

      - name: Bloco 3 — interface simples e compacta
        run: python3 scripts/ibr_admin_simple_patch.py 3

      - name: Testar bloco 3 com APK completo
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Salvar bloco 3
        run: |
          git add app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git commit -m "ui: deixar painel IBR mais simples e compacto"

      - name: Limpar arquivos temporários e publicar branch
        run: |
          rm -f app/google-services.json .env release.keystore
          git rm scripts/ibr_admin_simple_patch.py .github/workflows/ibr-admin-simple-blocks.yml
          git commit -m "chore: remover validação temporária do IBR"
          git push origin HEAD:feat/ibr-admin-simple-cleanup

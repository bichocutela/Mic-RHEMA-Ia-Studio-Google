name: Validar player YouTube IBR

on:
  push:
    branches:
      - fix/ibr-youtube-player

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/ibr-youtube-player
          fetch-depth: 0

      - name: Aplicar integração do player
        run: python3 scripts/apply_ibr_youtube_player.py

      - name: Commitar integração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/CleanVideoPlayer.kt \
                  app/src/main/java/com/aistudio/micrhema/IbrScreen.kt \
                  app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix(ibr): usar player YouTube reutilizável nas aulas"
            git push origin HEAD:fix/ibr-youtube-player
          fi

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar assinatura
        run: echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Configurar Supabase público
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - name: Compilar APK release
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Limpar temporários
        if: always()
        run: rm -f release.keystore .env app/google-services.json

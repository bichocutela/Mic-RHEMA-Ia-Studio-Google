name: Diagnosticar bases bíblicas

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-bible-deep-search-fix.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnosticar JSON
        run: python3 tools/diagnose_bible_json.py

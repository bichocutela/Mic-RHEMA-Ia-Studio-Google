name: Aplicar correção da pesquisa profunda

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-bible-deep-search-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir pesquisa profunda
        run: python3 tools/fix_bible_deep_search.py

      - name: Publicar correção
        run: |
          rm -f .github/workflows/apply-bible-deep-search-fix.yml tools/fix_bible_deep_search.py
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(bible): tornar pesquisa profunda funcional para temas e flexões"
          git push

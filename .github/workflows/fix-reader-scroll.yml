name: Fix reader scroll compile

on:
  push:
    branches:
      - feat/internal-docx-epub-xodo-share
    paths:
      - '.github/workflows/fix-reader-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir cálculo de progresso do WebView
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/aistudio/micrhema/RichDocumentReader.kt')
          text = path.read_text(encoding='utf-8')
          old = '                    val range = (computeVerticalScrollRange() - height).coerceAtLeast(1)\n'
          new = '                    val range = ((contentHeight * scale).toInt() - height).coerceAtLeast(1)\n'
          if text.count(old) != 1:
              raise SystemExit(f'esperava exatamente 1 ocorrência, encontrei {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/fix-reader-scroll.yml').unlink()
      - name: Conferir
        run: |
          grep -q 'contentHeight \* scale' app/src/main/java/com/aistudio/micrhema/RichDocumentReader.kt
          ! grep -q 'computeVerticalScrollRange' app/src/main/java/com/aistudio/micrhema/RichDocumentReader.kt
          git diff --check
      - name: Commitar na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: compile internal document reader scroll progress"
          git push origin HEAD:feat/internal-docx-epub-xodo-share

name: Publicar regras do Firestore

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firestore-rules:
    name: Publicar regras do Firestore
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar no Firebase/Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          project_id: mic-rhema

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar regras do Firestore
        run: firebase deploy --only firestore:rules --project mic-rhema --non-interactive

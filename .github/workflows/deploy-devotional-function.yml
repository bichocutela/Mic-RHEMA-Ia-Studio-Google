name: Validar e publicar notificação de devocional

on:
  pull_request:
    branches: [main]
    paths:
      - "firebase-functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-devotional-function.yml"
  push:
    branches: [main]
    paths:
      - "firebase-functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-devotional-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar Firebase Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase-functions/package-lock.json

      - name: Instalar dependências travadas
        run: npm ci --prefix firebase-functions

      - name: Validar sintaxe da Function
        run: node --check firebase-functions/index.js

      - name: Validar carregamento do módulo
        run: node -e "require('./firebase-functions/index.js'); console.log('Firebase Functions carregadas com sucesso.')"

  deploy:
    name: Publicar notifyNewDevotional
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: firebase-functions/package-lock.json

      - name: Instalar dependências travadas
        run: npm ci --prefix firebase-functions

      - name: Validar credencial de publicação
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "O secret FIREBASE_SERVICE_ACCOUNT_JSON não foi configurado."
            exit 1
          fi

      - name: Autenticar no Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: mic-rhema

      - name: Publicar somente o gatilho de devocional
        run: npx --yes firebase-tools@15.31.0 deploy --only functions:notifyNewDevotional --project mic-rhema --non-interactive

name: Process Badges Block 2
on:
  push:
    branches: [fix/badges-hd-block2]
    paths: ['.github/workflows/process-badges-block2.yml']
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/badges-hd-block2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramentas de renderização
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin webp
          python -m pip install --quiet pillow
      - name: Renderizar níveis 13 a 17 em 1024x1024
        run: |
          set -e
          out='app/src/main/res/drawable-nodpi'
          for n in 13 14 15 16 17; do
            rsvg-convert -w 1024 -h 1024 ".badge-sync/level${n}.svg" -o "/tmp/level${n}.png"
            cwebp -quiet -q 92 -alpha_q 100 -m 6 "/tmp/level${n}.png" -o "$out/profile_emblem_level_${n}.webp"
          done
      - name: Validar WebP, transparência e margem segura
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('app/src/main/res/drawable-nodpi')
          for n in range(13,18):
              p=root/f'profile_emblem_level_{n}.webp'
              im=Image.open(p).convert('RGBA')
              if im.size != (1024,1024):
                  raise SystemExit(f'Nível {n}: resolução incorreta {im.size}')
              a=im.getchannel('A')
              if a.getextrema()[0] != 0:
                  raise SystemExit(f'Nível {n}: sem transparência real')
              bbox=a.getbbox()
              if not bbox:
                  raise SystemExit(f'Nível {n}: vazio')
              margin=min(bbox[0],bbox[1],1024-bbox[2],1024-bbox[3])
              if margin < 42:
                  raise SystemExit(f'Nível {n}: margem segura insuficiente {margin}, bbox={bbox}')
              print(f'Nível {n}: 1024x1024, bbox={bbox}, margem={margin}, bytes={p.stat().st_size}')
          PY
          for n in 13 14 15 16 17; do
            dwebp "app/src/main/res/drawable-nodpi/profile_emblem_level_${n}.webp" -o "/tmp/check${n}.png" >/dev/null
          done
      - name: Validar ordem oficial 13 a 17
        run: |
          python <<'PY'
          from pathlib import Path
          text=Path('app/src/main/java/com/aistudio/micrhema/BadgeCatalog.kt').read_text()
          expected=[
            ('luz_do_mundo','Luz do Mundo',13),
            ('armadura_de_deus','Armadura de Deus',14),
            ('leao_de_juda','Leão de Judá',15),
            ('chama_do_espirito','Chama do Espírito',16),
            ('coroa_da_vida','Coroa da Vida',17),
          ]
          positions=[]
          for badge_id,name,level in expected:
              pos=text.find(f'BiblicalBadge("{badge_id}", "{name}"')
              if pos < 0:
                  raise SystemExit(f'Catálogo não contém nível {level}: {name}')
              positions.append(pos)
          if positions != sorted(positions):
              raise SystemExit('Ordem oficial 13–17 está incorreta no catálogo')
          print('Ordem validada: Luz do Mundo -> Armadura de Deus -> Leão de Judá -> Chama do Espírito -> Coroa da Vida')
          PY
      - name: Commitar bloco 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/profile_emblem_level_{13,14,15,16,17}.webp
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração de asset.'
          else
            git commit -m 'fix(badges): corrigir níveis 13 a 17 em 1024'
            git push origin HEAD:fix/badges-hd-block2
          fi

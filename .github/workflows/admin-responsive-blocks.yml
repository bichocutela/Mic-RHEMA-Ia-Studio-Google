name: Ajustar responsividade do painel ADM

on:
  push:
    branches:
      - 'feat/admin-responsive-layout'
    paths:
      - '.github/workflows/admin-responsive-blocks.yml'

permissions:
  contents: write

jobs:
  responsive-admin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/admin-responsive-layout
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar configuração de build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi
          echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bloco 1 — base responsiva e cabeçalhos globais
        run: |
          cat > app/src/main/java/com/aistudio/micrhema/AdminResponsive.kt <<'EOF'
          package com.aistudio.micrhema

          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Clear
          import androidx.compose.material.icons.filled.ExitToApp
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @Composable
          fun AdminResponsiveTopBar(
              title: String,
              fontScale: Float,
              onDecreaseFont: () -> Unit,
              onIncreaseFont: () -> Unit,
              onExit: () -> Unit
          ) {
              BoxWithConstraints(
                  modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surfaceVariant)
              ) {
                  val compact = maxWidth < 380.dp
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = if (compact) 8.dp else 16.dp, vertical = if (compact) 8.dp else 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          if (compact) "Painel ADM" else title,
                          fontWeight = FontWeight.Bold,
                          color = MaterialTheme.colorScheme.primary,
                          modifier = Modifier.weight(1f),
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis
                      )
                      val actionSize = if (compact) 40.dp else 48.dp
                      IconButton(onClick = onDecreaseFont, modifier = Modifier.size(actionSize)) {
                          Icon(Icons.Default.Clear, contentDescription = "Diminuir Fonte", tint = MaterialTheme.colorScheme.onSurface)
                      }
                      if (!compact) Text("Aa", fontSize = 16.sp * fontScale, color = MaterialTheme.colorScheme.onSurface)
                      IconButton(onClick = onIncreaseFont, modifier = Modifier.size(actionSize)) {
                          Icon(Icons.Default.Add, contentDescription = "Aumentar Fonte", tint = MaterialTheme.colorScheme.onSurface)
                      }
                      IconButton(onClick = onExit, modifier = Modifier.size(actionSize)) {
                          Icon(Icons.Default.ExitToApp, contentDescription = "Sair", tint = MaterialTheme.colorScheme.error)
                      }
                  }
              }
          }

          @Composable
          fun AdminSectionBackHeader(sectionName: String, onBack: () -> Unit) {
              BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                  val compact = maxWidth < 380.dp
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clickable(onClick = onBack)
                          .padding(horizontal = if (compact) 12.dp else 16.dp, vertical = if (compact) 10.dp else 14.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Icon(
                              Icons.AutoMirrored.Filled.ArrowBack,
                              contentDescription = "Voltar para o Painel Administrativo",
                              tint = MaterialTheme.colorScheme.primary,
                              modifier = Modifier.size(20.dp)
                          )
                          Spacer(Modifier.width(8.dp))
                          Text(
                              "Painel Administrativo",
                              style = MaterialTheme.typography.labelLarge,
                              fontWeight = FontWeight.Bold,
                              color = MaterialTheme.colorScheme.primary,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      if (sectionName.isNotEmpty()) {
                          Spacer(Modifier.height(6.dp))
                          Text(
                              sectionName,
                              style = if (compact) MaterialTheme.typography.titleLarge else MaterialTheme.typography.headlineSmall,
                              fontWeight = FontWeight.Bold,
                              color = MaterialTheme.colorScheme.onBackground,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
              }
          }

          @Composable
          fun AdminActionHeader(
              title: String,
              subtitle: String = "",
              actionText: String,
              actionIcon: ImageVector? = Icons.Default.Add,
              onAction: () -> Unit
          ) {
              BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                  val compact = maxWidth < 400.dp
                  if (compact) {
                      Column(verticalArrangement = Arrangement.spacedBy(9.dp)) {
                          Column {
                              Text(title, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                              if (subtitle.isNotBlank()) Text(subtitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          Button(onClick = onAction, modifier = Modifier.fillMaxWidth()) {
                              actionIcon?.let { Icon(it, contentDescription = null); Spacer(Modifier.width(6.dp)) }
                              Text(actionText, maxLines = 1, overflow = TextOverflow.Ellipsis)
                          }
                      }
                  } else {
                      Row(modifier = Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(title, style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                              if (subtitle.isNotBlank()) Text(subtitle, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)
                          }
                          Spacer(Modifier.width(10.dp))
                          Button(onClick = onAction) {
                              actionIcon?.let { Icon(it, contentDescription = null); Spacer(Modifier.width(6.dp)) }
                              Text(actionText, maxLines = 1)
                          }
                      }
                  }
              }
          }

          @Composable
          fun AdminSafeHorizontalRow(
              modifier: Modifier = Modifier,
              content: @Composable RowScope.() -> Unit
          ) {
              Row(
                  modifier = modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
                  horizontalArrangement = Arrangement.spacedBy(8.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  content = content
              )
          }

          @Composable
          fun AdminAdaptivePair(
              first: @Composable (Modifier) -> Unit,
              second: @Composable (Modifier) -> Unit
          ) {
              BoxWithConstraints(modifier = Modifier.fillMaxWidth()) {
                  if (maxWidth < 380.dp) {
                      Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          first(Modifier.fillMaxWidth())
                          second(Modifier.fillMaxWidth())
                      }
                  } else {
                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          first(Modifier.weight(1f))
                          second(Modifier.weight(1f))
                      }
                  }
              }
          }
          EOF

          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path); text = p.read_text()
              if old not in text: raise SystemExit(f'marker not found in {path}')
              p.write_text(text.replace(old, new, 1))

          p='app/src/main/java/com/aistudio/micrhema/Screens.kt'
          old='''                    Row(
                        modifier = Modifier.fillMaxWidth().background(MaterialTheme.colorScheme.surfaceVariant).padding(16.dp),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text(
                            "Painel Administrativo",
                            fontWeight = FontWeight.Bold,
                            color = MaterialTheme.colorScheme.primary,
                            modifier = Modifier.weight(1f),
                            maxLines = 1,
                            overflow = androidx.compose.ui.text.style.TextOverflow.Ellipsis
                        )
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            IconButton(onClick = { updateAdminFontScale(adminFontScale - 0.1f) }) {
                                Icon(Icons.Filled.Clear, contentDescription = "Diminuir Fonte", tint = MaterialTheme.colorScheme.onSurface)
                            }
                            Text("Aa", fontSize = 16.sp * adminFontScale, color = MaterialTheme.colorScheme.onSurface)
                            IconButton(onClick = { updateAdminFontScale(adminFontScale + 0.1f) }) {
                                Icon(Icons.Filled.Add, contentDescription = "Aumentar Fonte", tint = MaterialTheme.colorScheme.onSurface)
                            }
                            IconButton(onClick = {
                                isAuthenticated = false
                                adminPrayerTargetState.value = null
                                runCatching {
                                    com.google.firebase.messaging.FirebaseMessaging.getInstance().unsubscribeFromTopic("prayer_admins")
                                    com.google.firebase.auth.FirebaseAuth.getInstance().signOut()
                                }
                            }) {
                                Icon(androidx.compose.material.icons.Icons.Default.ExitToApp, contentDescription = "Sair", tint = MaterialTheme.colorScheme.error)
                            }
                        }
                    }'''
          new='''                    AdminResponsiveTopBar(
                        title = "Painel Administrativo",
                        fontScale = adminFontScale,
                        onDecreaseFont = { updateAdminFontScale(adminFontScale - 0.1f) },
                        onIncreaseFont = { updateAdminFontScale(adminFontScale + 0.1f) },
                        onExit = {
                            isAuthenticated = false
                            adminPrayerTargetState.value = null
                            runCatching {
                                com.google.firebase.messaging.FirebaseMessaging.getInstance().unsubscribeFromTopic("prayer_admins")
                                com.google.firebase.auth.FirebaseAuth.getInstance().signOut()
                            }
                        }
                    )'''
          replace(p, old, new)

          old='''                    Column(
                        modifier = Modifier
                            .fillMaxWidth()
                            .clickable {
                                if (currentSection == AdminSection.PRAYERS) adminPrayerTargetState.value = null
                                currentSection = AdminSection.DASHBOARD
                            }
                            .padding(16.dp)
                    ) {
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Icon(
                                Icons.AutoMirrored.Filled.ArrowBack,
                                contentDescription = "Voltar para o Painel Administrativo",
                                tint = MaterialTheme.colorScheme.primary,
                                modifier = Modifier.size(20.dp)
                            )
                            Spacer(modifier = Modifier.width(8.dp))
                            Text(
                                text = "Painel Administrativo",
                                style = MaterialTheme.typography.labelLarge,
                                fontWeight = FontWeight.Bold,
                                color = MaterialTheme.colorScheme.primary
                            )
                        }
                        if (sectionName.isNotEmpty()) {
                            Spacer(Modifier.height(8.dp))
                            Text(
                                text = sectionName,
                                style = MaterialTheme.typography.headlineSmall,
                                fontWeight = FontWeight.Bold,
                                color = MaterialTheme.colorScheme.onBackground
                            )
                        }
                    }'''
          new='''                    AdminSectionBackHeader(sectionName = sectionName) {
                        if (currentSection == AdminSection.PRAYERS) adminPrayerTargetState.value = null
                        currentSection = AdminSection.DASHBOARD
                    }'''
          replace(p, old, new)
          PY

      - name: Testar bloco 1
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit bloco 1
        run: |
          git add app/src/main/java/com/aistudio/micrhema/AdminResponsive.kt app/src/main/java/com/aistudio/micrhema/Screens.kt
          git commit -m "Make admin shell responsive"

      - name: Bloco 2 — cabeçalhos, filtros e ações principais
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              if old not in text: raise SystemExit(f'marker not found in {path}: {old[:60]!r}')
              p.write_text(text.replace(old,new,count))

          # Membros: cabeçalho adaptativo, filtros e permissões roláveis em telas estreitas.
          p='app/src/main/java/com/aistudio/micrhema/MembersAdmin.kt'
          text=Path(p).read_text()
          text=text.replace('import androidx.compose.foundation.clickable\n', 'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.horizontalScroll\nimport androidx.compose.foundation.rememberScrollState\n', 1)
          old='''        Row(
            modifier = Modifier.fillMaxWidth(),
            horizontalArrangement = Arrangement.SpaceBetween,
            verticalAlignment = Alignment.CenterVertically
        ) {
            Column(modifier = Modifier.weight(1f)) {
                Text("Gerenciar Membros", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
                Text(
                    "Aprovações, permissões e dados de cadastro sincronizados.",
                    style = MaterialTheme.typography.bodySmall,
                    color = MaterialTheme.colorScheme.onSurfaceVariant
                )
            }
            Button(onClick = {
                newMemberName = ""
                newMemberPhone = ""
                showAddMemberDialog = true
            }) {
                Icon(Icons.Default.Person, contentDescription = null)
                Spacer(Modifier.width(6.dp))
                Text("Adicionar")
            }
        }'''
          new='''        AdminActionHeader(
            title = "Gerenciar Membros",
            subtitle = "Aprovações, permissões e dados de cadastro sincronizados.",
            actionText = "Adicionar",
            actionIcon = Icons.Default.Person,
            onAction = {
                newMemberName = ""
                newMemberPhone = ""
                showAddMemberDialog = true
            }
        )'''
          if old not in text: raise SystemExit('members header marker')
          text=text.replace(old,new,1)
          text=text.replace('''        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            listOf("Todos", "Pendentes", "Aprovados", "IBR").forEach { filter ->''','''        AdminSafeHorizontalRow {
            listOf("Todos", "Pendentes", "Aprovados", "IBR").forEach { filter ->''',1)
          text=text.replace('''                            Row(verticalAlignment = Alignment.CenterVertically) {
                                Checkbox(''','''                            AdminSafeHorizontalRow {
                                Checkbox(''',1)
          Path(p).write_text(text)

          # Notícias: cabeçalho adaptativo e filtros sempre acessíveis.
          p='app/src/main/java/com/aistudio/micrhema/NewsAdmin.kt'
          text=Path(p).read_text()
          text=text.replace('import androidx.compose.foundation.rememberScrollState\n', 'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.horizontalScroll\n', 1)
          old='''        Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
            Text("Gerenciar Avisos / Notícias", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
            Button(onClick = { showDialog = true; editingNews = null }) {
                Icon(Icons.Default.Add, contentDescription = "Adicionar")
                Spacer(Modifier.width(4.dp))
                Text("Novo")
            }
        }'''
          new='''        AdminActionHeader(
            title = "Gerenciar Avisos / Notícias",
            actionText = "Novo",
            onAction = { showDialog = true; editingNews = null }
        )'''
          if old not in text: raise SystemExit('news header marker')
          text=text.replace(old,new,1)
          text=text.replace('''        Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
            FilterChip(selected = intensityFilter == null''','''        AdminSafeHorizontalRow {
            FilterChip(selected = intensityFilter == null''',1)
          Path(p).write_text(text)

          # Equipe: botão desce para largura total em aparelhos pequenos.
          p='app/src/main/java/com/aistudio/micrhema/TeamModule.kt'
          text=Path(p).read_text()
          old='''        Row(
            modifier = Modifier.fillMaxWidth(),
            horizontalArrangement = Arrangement.SpaceBetween,
            verticalAlignment = Alignment.CenterVertically
        ) {
            Text("Gerenciar Equipe", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)
            Button(onClick = { showAddDialog = true }) {
                Text("Adicionar Membro")
            }
        }'''
          new='''        AdminActionHeader(
            title = "Gerenciar Equipe",
            actionText = "Adicionar Membro",
            onAction = { showAddDialog = true }
        )'''
          if old not in text: raise SystemExit('team header marker')
          Path(p).write_text(text.replace(old,new,1))

          # Cultos/eventos: ações adaptativas em cada aba.
          p='app/src/main/java/com/aistudio/micrhema/AdminServicesV2.kt'
          text=Path(p).read_text()
          old='''            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                Column(Modifier.weight(1f)) { Text("Cultos Fixos", fontWeight = FontWeight.Bold); Text("Sem data de início ou término", style = MaterialTheme.typography.bodySmall) }
                Button(onClick = { editingService = null; showServiceDialog = true }) { Icon(Icons.Default.Add, null); Spacer(Modifier.width(4.dp)); Text("Novo") }
            }'''
          new='''            AdminActionHeader(
                title = "Cultos Fixos",
                subtitle = "Sem data de início ou término",
                actionText = "Novo",
                onAction = { editingService = null; showServiceDialog = true }
            )'''
          if old not in text: raise SystemExit('services fixed marker')
          text=text.replace(old,new,1)
          old='''            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                Column(Modifier.weight(1f)) { Text("Eventos", fontWeight = FontWeight.Bold); Text("Com início, término, banner e publicação", style = MaterialTheme.typography.bodySmall) }
                Button(onClick = { editingEvent = null; showEventDialog = true }) { Icon(Icons.Default.Add, null); Spacer(Modifier.width(4.dp)); Text("Novo") }
            }'''
          new='''            AdminActionHeader(
                title = "Eventos",
                subtitle = "Com início, término, banner e publicação",
                actionText = "Novo",
                onAction = { editingEvent = null; showEventDialog = true }
            )'''
          if old not in text: raise SystemExit('services event marker')
          Path(p).write_text(text.replace(old,new,1))

          # Loja XP: filtros e seletores não somem; passam a rolar horizontalmente quando necessário.
          p='app/src/main/java/com/aistudio/micrhema/AdminXpShop.kt'
          text=Path(p).read_text()
          text=text.replace('import androidx.compose.foundation.layout.*\n', 'import androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.horizontalScroll\n',1)
          text=text.replace('''                Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.fillMaxWidth()) {
                    listOf("todos" to "Todos", "pendente" to "Pendentes", "entregue" to "Entregues", "cancelado" to "Cancelados").forEach''','''                AdminSafeHorizontalRow {
                    listOf("todos" to "Todos", "pendente" to "Pendentes", "entregue" to "Entregues", "cancelado" to "Cancelados").forEach''',1)
          text=text.replace('''                Row(horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                    FilterChip(selected = kind == "digital"''','''                AdminSafeHorizontalRow {
                    FilterChip(selected = kind == "digital"''',1)
          Path(p).write_text(text)
          PY

      - name: Testar bloco 2
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit bloco 2
        run: |
          git add app/src/main/java/com/aistudio/micrhema/MembersAdmin.kt app/src/main/java/com/aistudio/micrhema/NewsAdmin.kt app/src/main/java/com/aistudio/micrhema/TeamModule.kt app/src/main/java/com/aistudio/micrhema/AdminServicesV2.kt app/src/main/java/com/aistudio/micrhema/AdminXpShop.kt
          git commit -m "Adapt admin actions to small screens"

      - name: Bloco 3 — dashboard, banners, planos e devocionais
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Dashboard: cartões pares viram uma coluna em telas pequenas.
          p=Path('app/src/main/java/com/aistudio/micrhema/AdminDashboard.kt')
          text=p.read_text()
          old='''                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    AdminOverviewCard(
                        title = "Pendentes",
                        value = pendingCount.toString(),
                        icon = Icons.Default.Warning,
                        accent = MaterialTheme.colorScheme.error,
                        onClick = { onNavigate(AdminSection.MEMBERS) },
                        modifier = Modifier.weight(1f)
                    )
                    AdminOverviewCard(
                        title = "Aprovados",
                        value = approvedCount.toString(),
                        icon = Icons.Default.CheckCircle,
                        accent = MaterialTheme.colorScheme.primary,
                        modifier = Modifier.weight(1f)
                    )
                }'''
          new='''                AdminAdaptivePair(
                    first = { modifier -> AdminOverviewCard(
                        title = "Pendentes",
                        value = pendingCount.toString(),
                        icon = Icons.Default.Warning,
                        accent = MaterialTheme.colorScheme.error,
                        onClick = { onNavigate(AdminSection.MEMBERS) },
                        modifier = modifier
                    ) },
                    second = { modifier -> AdminOverviewCard(
                        title = "Aprovados",
                        value = approvedCount.toString(),
                        icon = Icons.Default.CheckCircle,
                        accent = MaterialTheme.colorScheme.primary,
                        modifier = modifier
                    ) }
                )'''
          if old not in text: raise SystemExit('dashboard overview 1')
          text=text.replace(old,new,1)
          old='''                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    AdminOverviewCard(
                        title = "Alunos IBR",
                        value = ibrCount.toString(),
                        icon = Icons.Default.School,
                        accent = MaterialTheme.colorScheme.tertiary,
                        modifier = Modifier.weight(1f)
                    )
                    AdminOverviewCard(
                        title = "Itens de mídia",
                        value = mediaCount.toString(),
                        icon = Icons.Default.PlayCircle,
                        accent = MaterialTheme.colorScheme.secondary,
                        onClick = { onNavigate(AdminSection.MEDIA) },
                        modifier = Modifier.weight(1f)
                    )
                }'''
          new='''                AdminAdaptivePair(
                    first = { modifier -> AdminOverviewCard(
                        title = "Alunos IBR",
                        value = ibrCount.toString(),
                        icon = Icons.Default.School,
                        accent = MaterialTheme.colorScheme.tertiary,
                        modifier = modifier
                    ) },
                    second = { modifier -> AdminOverviewCard(
                        title = "Itens de mídia",
                        value = mediaCount.toString(),
                        icon = Icons.Default.PlayCircle,
                        accent = MaterialTheme.colorScheme.secondary,
                        onClick = { onNavigate(AdminSection.MEDIA) },
                        modifier = modifier
                    ) }
                )'''
          if old not in text: raise SystemExit('dashboard overview 2')
          text=text.replace(old,new,1)
          for a,b,c,d in [
              ('Nova notícia','Article','NEWS','Adicionar mídia','CloudUpload','MEDIA'),
              ('Aprovar membros','PersonAdd','MEMBERS','Novo destaque','ViewCarousel','BANNERS'),
              ('Atualizar culto','Event','SERVICES','Curso IBR','School','IBR')
          ]:
              old=f'''                Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {{\n                    AdminQuickActionCard("{a}", Icons.Default.{b}, {{ onNavigate(AdminSection.{c}) }}, Modifier.weight(1f))\n                    AdminQuickActionCard("{d}", Icons.Default.'''

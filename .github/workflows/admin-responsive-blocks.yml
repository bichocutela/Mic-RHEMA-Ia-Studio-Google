name: Validar responsividade do painel ADM

on:
  push:
    branches:
      - feat/admin-responsive-layout
    paths:
      - .github/workflows/admin-responsive-blocks.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/admin-responsive-layout
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar configuração
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi
          echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bloco 1 - estrutura global
        run: python3 scripts/admin_responsive_patch.py 1

      - name: Testar bloco 1
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit bloco 1
        run: |
          git add app/src/main/java/com/aistudio/micrhema/AdminResponsive.kt app/src/main/java/com/aistudio/micrhema/Screens.kt
          git commit -m "Make admin shell responsive"

      - name: Bloco 2 - secoes principais
        run: python3 scripts/admin_responsive_patch.py 2

      - name: Testar bloco 2
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit bloco 2
        run: |
          git add app/src/main/java/com/aistudio/micrhema/MembersAdmin.kt app/src/main/java/com/aistudio/micrhema/NewsAdmin.kt app/src/main/java/com/aistudio/micrhema/TeamModule.kt app/src/main/java/com/aistudio/micrhema/AdminServicesV2.kt app/src/main/java/com/aistudio/micrhema/AdminXpShop.kt
          git commit -m "Adapt admin actions to small screens"

      - name: Bloco 3 - dashboard e acoes pareadas
        run: python3 scripts/admin_responsive_patch.py 3

      - name: Testar bloco 3
        run: ./gradlew :app:compileReleaseKotlin --no-daemon

      - name: Commit bloco 3
        run: |
          git add app/src/main/java/com/aistudio/micrhema/AdminDashboard.kt app/src/main/java/com/aistudio/micrhema/AdminMoreSections.kt app/src/main/java/com/aistudio/micrhema/AdminXpShop.kt
          git commit -m "Adapt admin grids and paired actions"

      - name: Gerar APK de validacao
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publicar branch
        run: |
          rm -f app/google-services.json release.keystore .env
          git push origin feat/admin-responsive-layout

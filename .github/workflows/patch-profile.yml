name: Patch profile XP purchases
on:
  push:
    branches:
      - feat/profile-xp-purchases
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-xp-purchases
          fetch-depth: 0
      - name: Patch files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt')
          s=p.read_text()
          if 'var showXpPurchases by remember' not in s:
              s=s.replace('    var showAchievementProgress by remember { mutableStateOf(false) }\n','    var showAchievementProgress by remember { mutableStateOf(false) }\n    var showXpPurchases by remember { mutableStateOf(false) }\n',1)
          if 'Text("Ver Compras XP"' not in s:
              needle='            Spacer(modifier = Modifier.height(24.dp))\n\n            ProfileField(\n                label = "Nome completo",'
              insert='            Spacer(modifier = Modifier.height(16.dp))\n\n            OutlinedButton(\n                onClick = { showXpPurchases = true },\n                modifier = Modifier.fillMaxWidth()\n            ) {\n                Icon(Icons.Default.ReceiptLong, contentDescription = null)\n                Spacer(modifier = Modifier.width(8.dp))\n                Text("Ver Compras XP", fontWeight = FontWeight.SemiBold)\n            }\n\n            Spacer(modifier = Modifier.height(24.dp))\n\n            ProfileField(\n                label = "Nome completo",'
              if needle not in s: raise SystemExit('profile insert marker not found')
              s=s.replace(needle,insert,1)
          if 'XpPurchasesDialog(' not in s:
              needle='    if (showAchievementProgress) {\n        AchievementProgressDialog('
              insert='    if (showXpPurchases) {\n        XpPurchasesDialog(\n            member = loggedInMember,\n            onDismiss = { showXpPurchases = false }\n        )\n    }\n\n    if (showAchievementProgress) {\n        AchievementProgressDialog('
              if needle not in s: raise SystemExit('dialog marker not found')
              s=s.replace(needle,insert,1)
          p.write_text(s)
          b=Path('app/src/main/java/com/aistudio/micrhema/BadgeFrame.kt')
          s=b.read_text().replace('XpRewardManager.isOwned(context, XpRewardManager.PROMISE_FRAME)','XpRewardManager.isActive(context, XpRewardManager.PROMISE_FRAME)',1).replace('XpRewardManager.isOwned(context, XpRewardManager.READER_BADGE)','XpRewardManager.isActive(context, XpRewardManager.READER_BADGE)',1)
          b.write_text(s)
          PY
          rm -f .github/workflows/profile-xp-purchases-patch.yml .github/workflows/patch-profile.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt app/src/main/java/com/aistudio/micrhema/BadgeFrame.kt .github/workflows
          git commit -m 'feat(profile): adicionar compras XP com previa e ativacao'
          git push origin HEAD:feat/profile-xp-purchases

name: Validar painel de progresso Android

on:
  push:
    branches: [feat/android-achievement-progress-dialog]
    paths:
      - 'app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt'
      - 'app/src/main/java/com/aistudio/micrhema/AchievementProgressDialog.kt'
      - '.github/workflows/validate-achievement-progress-dialog.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Preparar ambiente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - name: Compilar Kotlin release
        run: |
          chmod +x gradlew
          ./gradlew compileReleaseKotlin --no-daemon --stacktrace

      - name: Limpar arquivos temporários
        if: always()
        run: rm -f .env app/google-services.json

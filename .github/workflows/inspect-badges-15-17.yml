name: Inspect Badges 15-17
on:
  push:
    branches: [fix/badges-hd-block2]
    paths: ['.github/workflows/inspect-badges-15-17.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp imagemagick
      - name: Decodificar e montar contato
        run: |
          set -e
          mkdir -p /tmp/contact
          for n in 14 15 16 17; do
            f="app/src/main/res/drawable-nodpi/profile_emblem_level_${n}.webp"
            echo "=== NIVEL $n ==="
            webpinfo "$f" | grep -E 'Canvas size|Width|Height|Alpha' || true
            dwebp "$f" -o "/tmp/contact/${n}.png"
            convert "/tmp/contact/${n}.png" -thumbnail '300x300>' -background '#20242b' -gravity center -extent 320x320 "/tmp/contact/${n}_thumb.png"
          done
          convert /tmp/contact/14_thumb.png /tmp/contact/15_thumb.png /tmp/contact/16_thumb.png /tmp/contact/17_thumb.png +append badge-contact-14-17.png
      - uses: actions/upload-artifact@v4
        with:
          name: badge-contact-14-17
          path: badge-contact-14-17.png

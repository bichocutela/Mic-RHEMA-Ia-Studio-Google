name: Validar barra do ADM IBR

on:
  push:
    branches:
      - 'feat/ibr-admin-simple-cleanup'
    paths:
      - '.github/workflows/ibr-admin-bottom-nav.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ibr-admin-simple-cleanup
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Restaurar configuração
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bloco 4 — liberar mais espaço no painel ADM
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/aistudio/micrhema/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='''                bottomBar = {\n                    if (!isImeVisible) {'''
          new='''                bottomBar = {\n                    if (!isImeVisible && currentRoute != Screen.Admin.route) {'''
          if old not in s:
              raise SystemExit('Bloco da barra inferior não encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Testar bloco 4
        run: ./gradlew compileReleaseKotlin --no-daemon --stacktrace
      - name: Salvar e limpar validação temporária
        run: |
          rm -f app/google-services.json .env
          git add app/src/main/java/com/aistudio/micrhema/MainActivity.kt
          git commit -m "ui: ocultar barra inferior na área administrativa"
          git rm .github/workflows/ibr-admin-bottom-nav.yml
          git commit -m "chore: remover validação temporária da barra ADM"
          git push origin HEAD:feat/ibr-admin-simple-cleanup

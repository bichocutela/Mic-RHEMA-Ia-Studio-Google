name: Diagnostic XP Owner

on:
  push:
    branches:
      - diag/xp-owner-110

permissions:
  contents: read

jobs:
  lookup:
    name: Cruzar member_id com Firebase
    runs-on: ubuntu-latest
    steps:
      - name: Ler perfil sanitizado
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MEMBER_ID: 97a0913b-88e5-4d5e-b112-e036b276a794
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmpdir/sa.json"
          client_email="$(jq -r '.client_email' "$tmpdir/sa.json")"
          jq -r '.private_key' "$tmpdir/sa.json" > "$tmpdir/key.pem"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          exp="$((now + 3600))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg scope 'https://www.googleapis.com/auth/datastore' \
            --arg aud 'https://oauth2.googleapis.com/token' \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}' | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$tmpdir/key.pem" | b64url)"
          assertion="${unsigned}.${signature}"

          token_json="$(curl -fsSL -X POST 'https://oauth2.googleapis.com/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=${assertion}")"
          access_token="$(printf '%s' "$token_json" | jq -r '.access_token // empty')"
          test -n "$access_token"

          url="https://firestore.googleapis.com/v1/projects/mic-rhema/databases/(default)/documents/acessos_pendentes/${MEMBER_ID}"
          response="$(curl -fsSL -H "Authorization: Bearer ${access_token}" "$url")"
          name="$(printf '%s' "$response" | jq -r '.fields.name.stringValue // ""')"
          phone="$(printf '%s' "$response" | jq -r '.fields.phone.stringValue // ""' | tr -cd '0-9')"
          last4="${phone: -4}"
          printf 'MEMBER_ID=%s\n' "$MEMBER_ID"
          printf 'NAME=%s\n' "$name"
          printf 'PHONE_LAST4=%s\n' "$last4"

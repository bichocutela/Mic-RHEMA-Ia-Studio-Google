name: Apply EPUB Admin Patch

on:
  push:
    branches:
      - "feat/internal-docx-epub-xodo-share"

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch VipAdmin
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/aistudio/micrhema/VipAdmin.kt")
          text = p.read_text(encoding="utf-8")
          old = "Cole um link do Google Drive. O sistema detectará automaticamente PDF, Word (DOCX), Áudio (MP3), Vídeo (MP4) ou Imagem."
          new = "Cole um link do Google Drive. O sistema detectará automaticamente PDF, EPUB, Word (DOCX), Áudio (MP3), Vídeo (MP4) ou Imagem."
          if old in text:
              text = text.replace(old, new, 1)
          word = """                                GoogleDriveService.FileType.WORD -> {
                                    smartMessage = \"Documento Word detectado e adicionado!\"
                                    addVipBook(ContentBook(id = System.currentTimeMillis().toString(), title = \"Novo Documento Word Importado\", author = \"Documento Word\", coverUrl = \"https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=500&q=80\", contentText = \"\", bookUrl = GoogleDriveService.getDirectDownloadLink(smartUrl), type = \"word\"))
                                }
"""
          epub = """                                GoogleDriveService.FileType.EPUB -> {
                                    smartMessage = \"Livro EPUB detectado e adicionado!\"
                                    addVipBook(ContentBook(id = System.currentTimeMillis().toString(), title = \"Novo Livro EPUB Importado\", author = \"EPUB\", coverUrl = \"\", contentText = \"\", bookUrl = GoogleDriveService.getDirectDownloadLink(smartUrl), type = \"epub\"))
                                }
"""
          if "GoogleDriveService.FileType.EPUB ->" not in text:
              if word not in text:
                  raise SystemExit("Bloco WORD não encontrado")
              text = text.replace(word, word + epub, 1)
          p.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-epub-admin-patch.yml").unlink()
          old_runner = Path(".github/workflows/patch-smart-import-epub.yml")
          if old_runner.exists():
              old_runner.unlink()
      - name: Validate patch
        run: |
          grep -Fq 'PDF, EPUB, Word (DOCX)' app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          grep -Fq 'GoogleDriveService.FileType.EPUB ->' app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          grep -Fq 'type = "epub"' app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add EPUB to IBR Smart Import"
          git push origin HEAD:feat/internal-docx-epub-xodo-share

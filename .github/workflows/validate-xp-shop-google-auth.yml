name: Validate XP Shop Google Auth Fix

on:
  push:
    branches:
      - fix/xp-shop-google-auth

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar OAuth Google e catálogo com sessão Firebase real
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_MEMBER_ID: b34a4ded-4115-45b7-87fa-e9adb0be0e93
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmpdir/sa.json"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$tmpdir/google-services.json"
          client_email="$(jq -r '.client_email' "$tmpdir/sa.json")"
          jq -r '.private_key' "$tmpdir/sa.json" > "$tmpdir/key.pem"
          api_key="$(jq -r '.client[0].api_key[0].current_key' "$tmpdir/google-services.json")"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          exp="$((now + 3600))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"

          oauth_payload="$(jq -cn \
            --arg iss "$client_email" \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,scope:"https://www.googleapis.com/auth/datastore",aud:"https://oauth2.googleapis.com/token",iat:$iat,exp:$exp}' | b64url)"
          oauth_unsigned="${header}.${oauth_payload}"
          oauth_signature="$(printf '%s' "$oauth_unsigned" | openssl dgst -sha256 -sign "$tmpdir/key.pem" | b64url)"
          oauth_assertion="${oauth_unsigned}.${oauth_signature}"
          oauth_status="$(curl -sS -o "$tmpdir/oauth.json" -w '%{http_code}' -X POST 'https://oauth2.googleapis.com/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=${oauth_assertion}")"
          echo "Google OAuth status: ${oauth_status}; resposta: $(jq -c '{error,error_description,token_type,expires_in}' "$tmpdir/oauth.json")"

          custom_payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg uid "$TEST_MEMBER_ID" \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,sub:$iss,aud:"https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit",iat:$iat,exp:$exp,uid:$uid}' | b64url)"
          custom_unsigned="${header}.${custom_payload}"
          custom_signature="$(printf '%s' "$custom_unsigned" | openssl dgst -sha256 -sign "$tmpdir/key.pem" | b64url)"
          custom_token="${custom_unsigned}.${custom_signature}"

          signin="$(curl -fsSL -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg token "$custom_token" '{token:$token,returnSecureToken:true}')")"
          id_token="$(printf '%s' "$signin" | jq -r '.idToken // empty')"
          test -n "$id_token"

          body="$(jq -cn --arg memberId "$TEST_MEMBER_ID" '{action:"get_account",memberId:$memberId}')"
          engine_status="$(curl -sS -o "$tmpdir/engine.json" -w '%{http_code}' -X POST "${SUPABASE_URL%/}/functions/v1/xp-engine" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${id_token}" \
            -H 'Content-Type: application/json' \
            -d "$body")"
          echo "xp-engine status: ${engine_status}; resposta: $(jq -c '{ok,error,unlocked,account:{member_id:.account.member_id,balance:.account.balance}}' "$tmpdir/engine.json")"

          shop_body="$(jq -cn --arg memberId "$TEST_MEMBER_ID" '{action:"catalog",memberId:$memberId}')"
          shop_status="$(curl -sS -o "$tmpdir/shop.json" -w '%{http_code}' -X POST "${SUPABASE_URL%/}/functions/v1/xp-shop" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${id_token}" \
            -H 'Content-Type: application/json' \
            -d "$shop_body")"
          echo "xp-shop status: ${shop_status}; resposta: $(jq -c '{ok,error,unlocked,account:{member_id:.account.member_id,balance:.account.balance},items:(.items|length?)}' "$tmpdir/shop.json")"

          test "$oauth_status" = "200"
          test "$engine_status" = "200"
          test "$shop_status" = "200"
          jq -e '.ok == true' "$tmpdir/shop.json" >/dev/null
          jq -e '.account.member_id == env.TEST_MEMBER_ID' "$tmpdir/shop.json" >/dev/null
          jq -e '.account.balance >= 0' "$tmpdir/shop.json" >/dev/null
          echo "Loja XP respondeu corretamente. Saldo retornado: $(jq -r '.account.balance' "$tmpdir/shop.json") XP"

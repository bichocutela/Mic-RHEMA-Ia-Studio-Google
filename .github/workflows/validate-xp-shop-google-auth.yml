name: Validate XP Shop Google Auth Fix

on:
  push:
    branches:
      - fix/xp-shop-google-auth

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar sessão Firebase e leitura do perfil
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          TEST_MEMBER_ID: b34a4ded-4115-45b7-87fa-e9adb0be0e93
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmpdir/sa.json"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$tmpdir/google-services.json"
          client_email="$(jq -r '.client_email' "$tmpdir/sa.json")"
          jq -r '.private_key' "$tmpdir/sa.json" > "$tmpdir/key.pem"
          api_key="$(jq -r '.client[0].api_key[0].current_key' "$tmpdir/google-services.json")"
          project_id="$(jq -r '.project_info.project_id' "$tmpdir/google-services.json")"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          exp="$((now + 3600))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          custom_payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg uid "$TEST_MEMBER_ID" \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,sub:$iss,aud:"https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit",iat:$iat,exp:$exp,uid:$uid}' | b64url)"
          custom_unsigned="${header}.${custom_payload}"
          custom_signature="$(printf '%s' "$custom_unsigned" | openssl dgst -sha256 -sign "$tmpdir/key.pem" | b64url)"
          custom_token="${custom_unsigned}.${custom_signature}"

          signin="$(curl -fsSL -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg token "$custom_token" '{token:$token,returnSecureToken:true}')")"
          id_token="$(printf '%s' "$signin" | jq -r '.idToken // empty')"
          test -n "$id_token"

          lookup_status="$(curl -sS -o "$tmpdir/lookup.json" -w '%{http_code}' -X POST "https://identitytoolkit.googleapis.com/v1/accounts:lookup?key=${api_key}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg idToken "$id_token" '{idToken:$idToken}')")"
          echo "Identity lookup status: ${lookup_status}; uid: $(jq -r '.users[0].localId // ""' "$tmpdir/lookup.json")"

          user_status="$(curl -sS -o "$tmpdir/user.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${id_token}" \
            "https://firestore.googleapis.com/v1/projects/${project_id}/databases/(default)/documents/users/${TEST_MEMBER_ID}")"
          echo "Firestore users status: ${user_status}; perfil: $(jq -c '{name:.fields.name.stringValue,isApproved:.fields.isApproved.booleanValue,isAdmin:.fields.isAdmin.booleanValue,unlockedBadges:(.fields.unlockedBadgeIds.arrayValue.values|length?)}' "$tmpdir/user.json")"

          test "$lookup_status" = "200"
          test "$user_status" = "200"
          jq -e '.users[0].localId == env.TEST_MEMBER_ID' "$tmpdir/lookup.json" >/dev/null
          jq -e '.fields.unlockedBadgeIds.arrayValue.values | length > 0' "$tmpdir/user.json" >/dev/null
          echo 'Sessão Firebase e leitura do perfil funcionam sem conta de serviço OAuth.'

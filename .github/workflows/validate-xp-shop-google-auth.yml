name: Validate XP Shop Google Auth Fix

on:
  push:
    branches:
      - fix/xp-shop-google-auth

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar catálogo com sessão Firebase real
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_MEMBER_ID: b34a4ded-4115-45b7-87fa-e9adb0be0e93
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmpdir/sa.json"
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$tmpdir/google-services.json"
          client_email="$(jq -r '.client_email' "$tmpdir/sa.json")"
          jq -r '.private_key' "$tmpdir/sa.json" > "$tmpdir/key.pem"
          api_key="$(jq -r '.client[0].api_key[0].current_key' "$tmpdir/google-services.json")"

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now="$(date +%s)"
          exp="$((now + 3600))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg uid "$TEST_MEMBER_ID" \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,sub:$iss,aud:"https://identitytoolkit.googleapis.com/google.identity.identitytoolkit.v1.IdentityToolkit",iat:$iat,exp:$exp,uid:$uid}' | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$tmpdir/key.pem" | b64url)"
          custom_token="${unsigned}.${signature}"

          signin="$(curl -fsSL -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${api_key}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg token "$custom_token" '{token:$token,returnSecureToken:true}')")"
          id_token="$(printf '%s' "$signin" | jq -r '.idToken // empty')"
          test -n "$id_token"

          response="$(curl -fsSL -X POST "${SUPABASE_URL%/}/functions/v1/xp-shop" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${id_token}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg memberId "$TEST_MEMBER_ID" '{action:"catalog",memberId:$memberId}')")"

          printf '%s' "$response" | jq -e '.ok == true' >/dev/null
          printf '%s' "$response" | jq -e '.account.member_id == env.TEST_MEMBER_ID' >/dev/null
          printf '%s' "$response" | jq -e '.account.balance >= 0' >/dev/null
          if printf '%s' "$response" | jq -r '.error // ""' | grep -qi 'autenticar no Google'; then
            echo 'A falha antiga ainda apareceu.' >&2
            exit 1
          fi
          echo "Loja XP respondeu corretamente. Saldo retornado: $(printf '%s' "$response" | jq -r '.account.balance') XP"

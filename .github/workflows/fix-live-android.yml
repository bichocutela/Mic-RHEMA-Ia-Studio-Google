name: Corrigir compilação da Live Android

on:
  push:
    paths:
      - '.github/workflows/fix-live-android.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover import incorreto de weight
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/aistudio/micrhema/LiveStream.kt')
          text = path.read_text()
          text = text.replace('import androidx.compose.foundation.layout.weight\n', '')
          path.write_text(text)
          PY
      - name: Commitar correção
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/LiveStream.kt
          git commit -m "fix(android): corrigir import da tela de transmissão"
          git push

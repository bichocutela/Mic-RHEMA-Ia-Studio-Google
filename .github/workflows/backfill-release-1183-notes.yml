name: Preencher novidades da versão 2.0.1.1183

on:
  push:
    branches:
      - fix/release-notes-portuguese

permissions:
  contents: write

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-notes-portuguese
          fetch-depth: 0

      - name: Atualizar texto da Release 2.0.1.1183
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes-1183.txt <<'EOF'
          • A versão atual do MIC Rhema agora aparece no rodapé do menu lateral, abaixo de Administração.
          • Quando uma versão mais nova for encontrada na verificação periódica, o menu mostra um aviso de atualização disponível.
          • Ao tocar no aviso, o aplicativo abre a tela Sobre para conferir e baixar a atualização.
          EOF
          gh release edit v2.0.1.1183 --notes-file /tmp/release-notes-1183.txt

      - name: Remover workflow temporário
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/backfill-release-1183-notes.yml
          git commit -m "chore: remover backfill temporário da release"
          git push origin HEAD:fix/release-notes-portuguese

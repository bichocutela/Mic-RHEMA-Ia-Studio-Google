name: Aplicar QR Code PWA na aba Sobre

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_about_pwa_qr.py'
      - '.github/workflows/apply-about-pwa-qr.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar alteração
        run: python3 scripts/apply_about_pwa_qr.py

      - name: Commitar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/AboutScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "feat(sobre): adicionar QR Code direto do PWA"
            git push origin HEAD:main
          fi

name: Publicar regras do Firestore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    name: Publicar regras de acesso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar credencial de publicação
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "O secret FIREBASE_SERVICE_ACCOUNT_JSON não foi configurado."
            exit 1
          fi

      - name: Autenticar no Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: mic-rhema

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar somente as regras do Firestore
        run: firebase deploy --only firestore:rules --project mic-rhema --non-interactive

name: Validar correcoes MIC Rhema

on:
  push:
    branches:
      - fix/background-notifications-storage-cleanup
    paths:
      - '.github/workflows/validate-background-notifications.yml'

permissions:
  contents: write

jobs:
  build:
    name: Validar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/background-notifications-storage-cleanup
          fetch-depth: 0

      - name: Corrigir verificador do patch
        run: python -c "from pathlib import Path; p=Path('scripts/apply_background_storage_fix.py'); t=p.read_text(); t=t.replace('if text.count(\'title = { Text(\\\"Excluir foto?\\\") }\') < 1:\n    raise RuntimeError(\"Diálogo de foto comum deveria existir apenas em outro arquivo\")\n', ''); p.write_text(t)"

      - name: Aplicar integracoes finais
        run: python scripts/apply_background_storage_fix.py

      - name: Validar diff
        run: git diff --check

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "O secret GOOGLE_SERVICES_JSON nao foi configurado."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar assinatura
        run: echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Configurar Supabase publico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - name: Compilar APK release
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
          AUTO_BUILD_NUMBER: 999999
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Salvar correcoes validadas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/NotificationHelper.kt \
                  app/src/main/java/com/aistudio/micrhema/StorageManager.kt \
                  app/src/main/java/com/aistudio/micrhema/AdminMoreSections.kt \
                  app/src/main/java/com/aistudio/micrhema/ContentAdmin.kt \
                  app/src/main/java/com/aistudio/micrhema/VipAdmin.kt \
                  scripts/apply_background_storage_fix.py
          if ! git diff --cached --quiet; then
            git commit -m "fix: integrar notificacoes em segundo plano e limpeza Supabase"
            git push origin HEAD:fix/background-notifications-storage-cleanup
          fi

      - name: Limpar temporarios
        if: always()
        run: rm -f release.keystore .env app/google-services.json

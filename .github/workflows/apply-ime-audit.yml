name: Aplicar auditoria de teclado

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ime-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correções
        run: python3 tools/apply_ime_audit.py

      - name: Publicar correções
        run: |
          rm -f .github/workflows/apply-ime-audit.yml tools/apply_ime_audit.py
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): impedir teclado de cobrir campos de texto"
          git push

name: Patch Smart Import EPUB

on:
  push:
    branches:
      - feat/internal-docx-epub-xodo-share
    paths:
      - '.github/workflows/patch-smart-import-epub.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adicionar EPUB ao Smart Import
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/com/aistudio/micrhema/VipAdmin.kt')
          text = path.read_text(encoding='utf-8')

          old_help = 'Cole um link do Google Drive. O sistema detectará automaticamente PDF, Word (DOCX), Áudio (MP3), Vídeo (MP4) ou Imagem.'
          new_help = 'Cole um link do Google Drive. O sistema detectará automaticamente PDF, EPUB, Word (DOCX), Áudio (MP3), Vídeo (MP4) ou Imagem.'
          if text.count(old_help) != 1:
              raise SystemExit(f'texto Smart Import esperado 1x; encontrado {text.count(old_help)}')
          text = text.replace(old_help, new_help, 1)

          marker = '''                                GoogleDriveService.FileType.WORD -> {
                                    smartMessage = "Documento Word detectado e adicionado!"
                                    addVipBook(ContentBook(id = System.currentTimeMillis().toString(), title = "Novo Documento Word Importado", author = "Documento Word", coverUrl = "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=500&q=80", contentText = "", bookUrl = GoogleDriveService.getDirectDownloadLink(smartUrl), type = "word"))
                                }
'''
          replacement = marker + '''                                GoogleDriveService.FileType.EPUB -> {
                                    smartMessage = "Livro EPUB detectado e adicionado!"
                                    addVipBook(ContentBook(id = System.currentTimeMillis().toString(), title = "Novo Livro EPUB Importado", author = "EPUB", coverUrl = "", contentText = "", bookUrl = GoogleDriveService.getDirectDownloadLink(smartUrl), type = "epub"))
                                }
'''
          if text.count(marker) != 1:
              raise SystemExit(f'bloco WORD esperado 1x; encontrado {text.count(marker)}')
          path.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          Path('.github/workflows/patch-smart-import-epub.yml').unlink()
      - name: Conferir
        run: |
          grep -q 'PDF, EPUB, Word (DOCX)' app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          grep -q 'FileType.EPUB' app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          grep -q 'type = "epub"' app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git diff --check
      - name: Commitar na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: detect EPUB in IBR Smart Import"
          git push origin HEAD:feat/internal-docx-epub-xodo-share

name: Validar categorias e acesso IBR

on:
  push:
    branches:
      - 'feat/ibr-categories-lesson-access'
    paths:
      - '.github/workflows/ibr-categories-access-blocks.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ibr-categories-lesson-access
          fetch-depth: 0

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar configuração
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi
          echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          chmod +x gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bloco 1 — categorias
        run: python3 scripts/patch_ibr_categories_access.py 1

      - name: Testar bloco 1
        run: ./gradlew compileReleaseKotlin --no-daemon

      - name: Commit bloco 1
        run: |
          git add app/src/main/java/com/aistudio/micrhema/IbrAdminSimpleHelpers.kt app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git commit -m "feat: permitir categorias personalizadas no IBR"

      - name: Bloco 2 — acesso de cursos e aulas
        run: python3 scripts/patch_ibr_categories_access.py 2

      - name: Testar bloco 2
        run: ./gradlew compileReleaseKotlin --no-daemon

      - name: Commit bloco 2
        run: |
          git add app/src/main/java/com/aistudio/micrhema/Data.kt app/src/main/java/com/aistudio/micrhema/IbrAdminSimpleHelpers.kt app/src/main/java/com/aistudio/micrhema/VipAdmin.kt
          git commit -m "feat: adicionar bloqueio simples de cursos e aulas"

      - name: Bloco 3 — aplicar regras ao aluno
        run: python3 scripts/patch_ibr_categories_access.py 3

      - name: Testar bloco 3 com APK completo
        run: ./gradlew assembleRelease --no-daemon

      - name: Commit bloco 3
        run: |
          git add app/src/main/java/com/aistudio/micrhema/IbrScreen.kt
          git commit -m "feat: aplicar regras de liberação no IBR"

      - name: Publicar branch e limpar temporários
        run: |
          rm -f app/google-services.json .env release.keystore
          git push origin HEAD:feat/ibr-categories-lesson-access
          git rm .github/workflows/ibr-categories-access-blocks.yml scripts/patch_ibr_categories_access.py
          git commit -m "chore: remover validação temporária do IBR"
          git push origin HEAD:feat/ibr-categories-lesson-access

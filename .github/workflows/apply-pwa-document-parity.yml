name: Apply PWA document parity

on:
  push:
    branches:
      - feat/pwa-docx-epub-share-parity
    paths:
      - .github/workflows/apply-pwa-document-parity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar leitores e compartilhamento na PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin = Path('pwa/client/src/components/AdminParityView.tsx')
          text = admin.read_text(encoding='utf-8')
          old = 'import { LiveStreamAdmin } from "./LiveStreamAdmin";\n'
          new = old + 'import { SharedIbrImportCard } from "./SharedIbrImportCard";\n'
          if 'SharedIbrImportCard' not in text:
              if old not in text: raise SystemExit('import LiveStreamAdmin não encontrado')
              text = text.replace(old, new, 1)
          old_state = '  const [section, setSection] = useState<Section>(() => new URLSearchParams(window.location.search).get("section") === "prayers" ? "prayers" : "dashboard");'
          new_state = '  const [section, setSection] = useState<Section>(() => { const requested = new URLSearchParams(window.location.search).get("section"); return requested === "prayers" ? "prayers" : requested === "ibr" ? "ibr" : "dashboard"; });'
          if old_state in text: text = text.replace(old_state, new_state, 1)
          elif new_state not in text: raise SystemExit('estado inicial ADM não encontrado')
          old_ibr = 'function IbrAdmin(){const items=useAdminCollection("ibr_courses");const[editing,setEditing]=useState<AnyDoc|null>(null);return <div className="admin-section"><SectionHeader title="Instituto Bíblico Rhema" subtitle="Cursos, módulos, aulas, vídeos, áudios, textos, PDFs e arquivos Word (.docx)." onAdd={()=>setEditing({id:createAdminDocumentId("ibr_courses"),chapters:[]})} addLabel="Novo curso"/><AdminRows items={items}'
          new_ibr = 'function IbrAdmin(){const items=useAdminCollection("ibr_courses");const[editing,setEditing]=useState<AnyDoc|null>(null);return <div className="admin-section"><SectionHeader title="Instituto Bíblico Rhema" subtitle="Cursos, aulas e Conteúdo IBR em PDF, EPUB e Word (.docx), sincronizados com o Android." onAdd={()=>setEditing({id:createAdminDocumentId("ibr_courses"),chapters:[]})} addLabel="Novo curso"/><SharedIbrImportCard courses={items}/><AdminRows items={items}'
          if old_ibr in text: text = text.replace(old_ibr, new_ibr, 1)
          elif '<SharedIbrImportCard courses={items}/>' not in text: raise SystemExit('bloco IbrAdmin não encontrado')
          admin.write_text(text, encoding='utf-8')

          ibr = Path('pwa/client/src/components/IbrParityView.tsx')
          text = ibr.read_text(encoding='utf-8')
          import_anchor = 'import type { PwaSessionLike } from "./AndroidParityViews";\n'
          imports = import_anchor + 'import { IbrContentLibrary } from "./IbrContentLibrary";\nimport { IbrStudyMaterials } from "./IbrStudyMaterials";\n'
          if 'IbrContentLibrary' not in text:
              if import_anchor not in text: raise SystemExit('âncora de import do IBR não encontrada')
              text = text.replace(import_anchor, imports, 1)
          course_list = '    {!ordered.length?<p className="parity-status">Nenhum módulo disponível.</p>'
          if '<IbrContentLibrary/>' not in text:
              if course_list not in text: raise SystemExit('lista de cursos IBR não encontrada')
              text = text.replace(course_list, '    <IbrContentLibrary/>\n' + course_list, 1)
          pattern = re.compile(r'\n\s*\{\(pdf\|\|docx\)&&<section style=\{\{marginTop:22,display:"grid",gap:10\}\}>.*?</section>\}', re.S)
          if '<IbrStudyMaterials lesson={lesson}/>' not in text:
              text, count = pattern.subn('\n    <IbrStudyMaterials lesson={lesson}/>', text, count=1)
              if count != 1: raise SystemExit(f'bloco de materiais IBR esperado 1x, encontrado {count}')
          ibr.write_text(text, encoding='utf-8')

          home = Path('pwa/client/src/pages/Home.tsx')
          text = home.read_text(encoding='utf-8')
          anchor = '  const adminView=view==="admin"||view==="xp-admin";\n'
          effect = '  useEffect(()=>{if((view==="admin"||view==="xp-admin")&&!adminSession?.isAdmin)setShowAdminLogin(true);else if(adminSession?.isAdmin)setShowAdminLogin(false)},[view,adminSession?.isAdmin]);\n\n'
          if effect.strip() not in text:
              if anchor not in text: raise SystemExit('âncora adminView não encontrada')
              text = text.replace(anchor, effect + anchor, 1)
          home.write_text(text, encoding='utf-8')
          PY
      - name: Validar patch
        run: |
          grep -Fq 'SharedIbrImportCard courses={items}' pwa/client/src/components/AdminParityView.tsx
          grep -Fq '<IbrContentLibrary/>' pwa/client/src/components/IbrParityView.tsx
          grep -Fq '<IbrStudyMaterials lesson={lesson}/>' pwa/client/src/components/IbrParityView.tsx
          grep -Fq 'setShowAdminLogin(true)' pwa/client/src/pages/Home.tsx
          git diff --check
      - name: Commitar integração
        run: |
          rm .github/workflows/apply-pwa-document-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pwa): integrate DOCX EPUB readers and share import"
          git push origin HEAD:feat/pwa-docx-epub-share-parity

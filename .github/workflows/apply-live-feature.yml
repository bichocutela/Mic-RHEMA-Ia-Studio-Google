name: Aplicar integração de Live

on:
  push:
    paths:
      - '.github/workflows/apply-live-feature.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar integração híbrida
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Padrão não encontrado em {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          # Android: rota da Home usa o wrapper com sinal/player da live.
          replace_once(
              'app/src/main/java/com/aistudio/micrhema/MainActivity.kt',
              'composable(Screen.Home.route) { HomeScreen(onNavigate = { route -> navController.navigate(route) { launchSingleTop = true } }) }',
              'composable(Screen.Home.route) { HomeScreenWithLive(onNavigate = { route -> navController.navigate(route) { launchSingleTop = true } }) }'
          )

          # Android: seção de live no painel administrativo.
          replace_once(
              'app/src/main/java/com/aistudio/micrhema/AdminDashboard.kt',
              'SERVICES, BANNERS, DONATIONS, PRAYERS,',
              'SERVICES, BANNERS, LIVE, DONATIONS, PRAYERS,'
          )
          replace_once(
              'app/src/main/java/com/aistudio/micrhema/AdminDashboard.kt',
              'item { AdminMenuItem("Destaques", "Banners e eventos da tela inicial", Icons.Default.ViewCarousel, { onNavigate(AdminSection.BANNERS) }) }\n',
              'item { AdminMenuItem("Destaques", "Banners e eventos da tela inicial", Icons.Default.ViewCarousel, { onNavigate(AdminSection.BANNERS) }) }\n            item { AdminMenuItem("Transmissão ao vivo", "Automático pelo YouTube e modo manual", Icons.Default.LiveTv, { onNavigate(AdminSection.LIVE) }) }\n'
          )

          replace_once(
              'app/src/main/java/com/aistudio/micrhema/Screens.kt',
              'AdminSection.BANNERS -> "Destaques"\n',
              'AdminSection.BANNERS -> "Destaques"\n                    AdminSection.LIVE -> "Transmissão ao vivo"\n'
          )
          replace_once(
              'app/src/main/java/com/aistudio/micrhema/Screens.kt',
              'AdminSection.BANNERS -> EditBannersSection()\n',
              'AdminSection.BANNERS -> EditBannersSection()\n                            AdminSection.LIVE -> EditLiveStreamSection()\n'
          )

          # Android: wrapper da Home e import de weight.
          live_path = Path('app/src/main/java/com/aistudio/micrhema/LiveStream.kt')
          live = live_path.read_text()
          if 'import androidx.compose.foundation.layout.weight' not in live:
              live = live.replace('import androidx.compose.foundation.layout.width\n', 'import androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.layout.weight\n')
          wrapper = '''\n@Composable\nfun HomeScreenWithLive(onNavigate: (String) -> Unit = {}) {\n    val live = liveStreamState.value\n    var playerOpen by remember { mutableStateOf(false) }\n    LaunchedEffect(Unit) {\n        LiveStreamRepository.start()\n        runCatching { LiveStreamRepository.refresh(false) }\n    }\n    Column(modifier = Modifier.fillMaxSize()) {\n        if (live.isLive && (live.videoId.isNotBlank() || live.url.isNotBlank())) {\n            Spacer(Modifier.height(8.dp))\n            LiveStreamHomeBanner { playerOpen = true }\n            Spacer(Modifier.height(8.dp))\n        }\n        Box(modifier = Modifier.fillMaxWidth().weight(1f)) {\n            HomeScreen(onNavigate = onNavigate)\n        }\n    }\n    if (playerOpen) LiveStreamPlayerDialog { playerOpen = false }\n}\n'''
          if 'fun HomeScreenWithLive(' not in live:
              marker = '\nprivate fun extractYoutubeVideoId(value: String): String {'
              if marker not in live:
                  raise SystemExit('Ponto de inserção do wrapper não encontrado em LiveStream.kt')
              live = live.replace(marker, wrapper + marker, 1)
          live_path.write_text(live)

          # PWA: seção de gerenciamento da live no painel.
          admin_path = Path('pwa/client/src/components/AdminParityView.tsx')
          admin = admin_path.read_text()
          if 'import { LiveStreamAdmin } from "./LiveStreamAdmin";' not in admin:
              admin = admin.replace('import "./AdminParityView.css";', 'import { LiveStreamAdmin } from "./LiveStreamAdmin";\nimport "./AdminParityView.css";')
          admin = admin.replace('| "services" | "banners" | "donations"', '| "services" | "banners" | "live" | "donations"')
          live_module = '    { id: "live", title: "Transmissão ao vivo", subtitle: "Automático pelo YouTube e modo manual", icon: Video },\n'
          banner_module = '    { id: "banners", title: "Destaques", subtitle: "Banners e eventos da Home", icon: Image },\n'
          if live_module not in admin:
              if banner_module not in admin:
                  raise SystemExit('Módulo Destaques não encontrado no ADM PWA')
              admin = admin.replace(banner_module, banner_module + live_module, 1)
          live_route = '  if (section === "live") return <LiveStreamAdmin/>;\n'
          services_route = '  if (section === "services") return <ServicesAdmin/>;\n'
          if live_route not in admin:
              if services_route not in admin:
                  raise SystemExit('Rota ServicesAdmin não encontrada no ADM PWA')
              admin = admin.replace(services_route, services_route + live_route, 1)
          admin_path.write_text(admin)

      - name: Commitar integração
        run: |
          if git diff --quiet; then
            echo "Integração já aplicada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/MainActivity.kt \
                  app/src/main/java/com/aistudio/micrhema/AdminDashboard.kt \
                  app/src/main/java/com/aistudio/micrhema/Screens.kt \
                  app/src/main/java/com/aistudio/micrhema/LiveStream.kt \
                  pwa/client/src/components/AdminParityView.tsx
          git commit -m "feat(live): integrar modo híbrido no Android e PWA"
          git push

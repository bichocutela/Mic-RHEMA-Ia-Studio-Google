name: Validate document readers

on:
  push:
    branches:
      - feat/internal-docx-epub-xodo-share

permissions:
  contents: read

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar ambiente
        run: |
          cp .env.example .env
          chmod +x gradlew
      - name: Compilar Kotlin Android
        run: ./gradlew :app:compileDebugKotlin --no-daemon

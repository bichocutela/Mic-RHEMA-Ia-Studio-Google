name: Ajustar Compras XP no Perfil

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-profile-xp-fix.yml'

permissions:
  contents: write

jobs:
  patch-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Aplicar ajuste
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt')
          text = path.read_text()

          anchor = '''    val badgeProgress = calculateBadgeProgress(loggedInMember)
    val unlockedBadgeIds = badgeProgress.unlockedIds
'''
          insert = '''    val badgeProgress = calculateBadgeProgress(loggedInMember)
    val unlockedBadgeIds = badgeProgress.unlockedIds

    var xpPurchasesChecked by remember(loggedInMember.id) {
        mutableStateOf(
            xpRedemptionsState.value?.memberId == loggedInMember.id ||
                xpEntitlementsState.value?.memberId == loggedInMember.id
        )
    }
    var xpPurchasesCheckFailed by remember(loggedInMember.id) { mutableStateOf(false) }
    val memberXpRedemptions = xpRedemptionsState.value
        ?.takeIf { it.memberId == loggedInMember.id }
        ?.redemptions
        .orEmpty()
    val memberXpEntitlements = xpEntitlementsState.value
        ?.takeIf { it.memberId == loggedInMember.id }
        ?.entitlements
        .orEmpty()
    val hasXpPurchases = memberXpRedemptions.any { it.status != "cancelado" } || memberXpEntitlements.isNotEmpty()

    LaunchedEffect(loggedInMember.id) {
        if (!xpPurchasesChecked) {
            xpPurchasesCheckFailed = false
            runCatching {
                XpShopClient.loadRedemptions(loggedInMember, context)
            }.onSuccess {
                xpPurchasesChecked = true
            }.onFailure {
                xpPurchasesCheckFailed = true
            }
        }
    }
'''
          if anchor not in text:
              raise SystemExit('Anchor de estado XP não encontrado')
          text = text.replace(anchor, insert, 1)

          old_ui = '''            Spacer(modifier = Modifier.height(16.dp))

            OutlinedButton(
                onClick = { showXpPurchases = true },
                modifier = Modifier.fillMaxWidth()
            ) {
                Icon(Icons.Default.ReceiptLong, contentDescription = null)
                Spacer(modifier = Modifier.width(8.dp))
                Text("Ver Compras XP", fontWeight = FontWeight.SemiBold)
            }

            Spacer(modifier = Modifier.height(24.dp))
'''
          new_ui = '''            Spacer(modifier = Modifier.height(16.dp))

            when {
                hasXpPurchases -> {
                    OutlinedButton(
                        onClick = { showXpPurchases = true },
                        modifier = Modifier.fillMaxWidth()
                    ) {
                        Icon(Icons.Default.ReceiptLong, contentDescription = null)
                        Spacer(modifier = Modifier.width(8.dp))
                        Text("Ver Compras XP", fontWeight = FontWeight.SemiBold)
                    }
                }
                xpPurchasesChecked -> {
                    Card(
                        modifier = Modifier.fillMaxWidth(),
                        shape = RoundedCornerShape(18.dp),
                        colors = CardDefaults.cardColors(
                            containerColor = MaterialTheme.colorScheme.primaryContainer.copy(alpha = 0.28f)
                        )
                    ) {
                        Column(
                            modifier = Modifier.padding(16.dp),
                            verticalArrangement = Arrangement.spacedBy(6.dp)
                        ) {
                            Text(
                                "Sua Loja XP está pronta ✨",
                                style = MaterialTheme.typography.titleSmall,
                                fontWeight = FontWeight.SemiBold
                            )
                            Text(
                                "Você ainda não fez nenhuma compra na Loja XP. Quando adquirir uma recompensa, ela aparecerá aqui no seu perfil.",
                                style = MaterialTheme.typography.bodySmall,
                                color = MaterialTheme.colorScheme.onSurfaceVariant
                            )
                        }
                    }
                }
                xpPurchasesCheckFailed -> {
                    Text(
                        "Não foi possível verificar suas compras XP agora. Entre novamente na sua conta para sincronizar e tente mais tarde.",
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                        modifier = Modifier.fillMaxWidth()
                    )
                }
                else -> {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.Center
                    ) {
                        CircularProgressIndicator(modifier = Modifier.size(18.dp), strokeWidth = 2.dp)
                        Spacer(modifier = Modifier.width(8.dp))
                        Text(
                            "Verificando suas compras XP…",
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSurfaceVariant
                        )
                    }
                }
            }

            Spacer(modifier = Modifier.height(24.dp))
'''
          if old_ui not in text:
              raise SystemExit('Bloco do botão Compras XP não encontrado')
          text = text.replace(old_ui, new_ui, 1)

          old_dialog = '''    if (showXpPurchases) {
        XpPurchasesDialog(
'''
          new_dialog = '''    if (showXpPurchases && hasXpPurchases) {
        XpPurchasesDialog(
'''
          if old_dialog not in text:
              raise SystemExit('Abertura do diálogo XP não encontrada')
          text = text.replace(old_dialog, new_dialog, 1)

          path.write_text(text)
          PY

          rm .github/workflows/temp-profile-xp-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt .github/workflows/temp-profile-xp-fix.yml
          git commit -m "fix(profile): exibir compras XP apenas quando houver compras"
          git push origin main

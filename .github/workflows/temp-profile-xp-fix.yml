name: Profile XP Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-profile-xp-fix.yml'

jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch profile
        run: python3 scripts/patch_profile_xp.py

      - name: Commit and push
        run: |
          rm .github/workflows/temp-profile-xp-fix.yml
          rm scripts/patch_profile_xp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt .github/workflows/temp-profile-xp-fix.yml scripts/patch_profile_xp.py
          git commit -m "fix(profile): exibir compras XP apenas quando houver compras"
          git push origin main

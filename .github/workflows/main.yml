name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'pwa/**'
      - 'supabase/functions/pwa-auth/**'
      - 'supabase/functions/pwa-profile/**'
      - 'supabase/functions/pwa-push-subscribe/**'
      - 'supabase/functions/pwa-push-send/**'
      - 'supabase/functions/pwa-badge-activity/**'
      - 'supabase/functions/pwa-prayer-request/**'
      - 'PWA_*.md'
      - 'todo.md'
      - '.github/workflows/pwa-pages.yml'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "O secret GOOGLE_SERVICES_JSON não foi configurado."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json

      - name: Configurar o Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Reconstruir chave de assinatura (release.keystore)
        run: |
          echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Configurar variáveis públicas do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - name: Calcular AUTO_BUILD_NUMBER
        run: |
          AUTO_BUILD_NUMBER=$((517 + ${{ github.run_number }}))
          echo "AUTO_BUILD_NUMBER=$AUTO_BUILD_NUMBER" >> $GITHUB_ENV

      - name: Construir o APK
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remover arquivos temporários de configuração
        if: always()
        run: rm -f release.keystore .env app/google-services.json

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-pronto
          path: '**/*.apk'

      - name: Extrair Versão e Preparar APK
        id: prep
        run: |
          source version.properties
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${AUTO_BUILD_NUMBER}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          APK_PATH=$(find . -name "*.apk" | grep release | head -n 1)
          NEW_APK_NAME="MIC-Rhema-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$NEW_APK_NAME"
          echo "APK_PATH=$NEW_APK_NAME" >> $GITHUB_ENV

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MicRhema ${{ env.VERSION_NAME }}
          files: ${{ env.APK_PATH }}
          make_latest: true

      - name: Notificar nova versão via Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Secrets do Supabase ausentes; notificação de atualização ignorada."
            exit 0
          fi
          RELEASE_URL="https://github.com/bichocutela/Mic-RHEMA-Ia-Studio-Google/releases/tag/v${VERSION_NAME}"
          jq -n \
            --arg topic "all_users" \
            --arg title "Tem atualização nova!" \
            --arg body "O MIC Rhema ${VERSION_NAME} já está disponível. Toque para conferir." \
            --arg version "${VERSION_NAME}" \
            --arg url "${RELEASE_URL}" \
            --arg destination "about" \
            '{topic:$topic,title:$title,body:$body,data:{category:"app_update",version:$version,url:$url,destination:$destination}}' > /tmp/mic-rhema-notification.json
          curl --fail-with-body --silent --show-error \
            -X POST "${SUPABASE_URL%/}/functions/v1/notify-fcm" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            --data @/tmp/mic-rhema-notification.json
          rm -f /tmp/mic-rhema-notification.json

      - name: Testar 8 notificações de Configurações
        if: contains(github.event.head_commit.message, '[notification-tests]')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          send_test() {
            local number="$1"
            local title="$2"
            local category="$3"
            local topic="$4"
            jq -n \
              --arg topic "$topic" \
              --arg title "[TESTE ${number}/8] ${title}" \
              --arg body "Teste da opção ${title} em Configurações." \
              --arg category "$category" \
              '{topic:$topic,title:$title,body:$body,data:{category:$category,test:"settings_notifications"}}' > /tmp/notification-test.json
            echo "Enviando teste ${number}/8: ${title} (${category})"
            curl --fail-with-body --silent --show-error \
              -X POST "${SUPABASE_URL%/}/functions/v1/notify-fcm" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              --data @/tmp/notification-test.json
            echo
            sleep 2
          }

          send_test "1" "Novos cursos" "course" "all_users"
          send_test "2" "Devocional diário às 8h" "devotional" "all_users"
          send_test "3" "Avisos de eventos e cultos" "event" "all_users"
          send_test "4" "Próximo culto" "service" "all_users"
          send_test "5" "Notícia do meio-dia" "news" "all_users"
          send_test "6" "Novas mídias" "media" "all_users"
          send_test "7" "Novas aulas e módulos IBR" "ibr" "all_users"
          send_test "8" "Novas pregações" "sermon" "all_users"
          rm -f /tmp/notification-test.json

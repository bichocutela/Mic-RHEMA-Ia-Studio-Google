name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "O secret GOOGLE_SERVICES_JSON não foi configurado."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json

      - name: Configurar o Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Reconstruir chave de assinatura (release.keystore)
        run: |
          echo "${{ secrets.MICRHEMA_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Configurar variáveis públicas do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - name: Calcular AUTO_BUILD_NUMBER
        run: |
          AUTO_BUILD_NUMBER=$((517 + ${{ github.run_number }}))
          echo "AUTO_BUILD_NUMBER=$AUTO_BUILD_NUMBER" >> $GITHUB_ENV

      - name: Construir o APK
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.MICRHEMA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICRHEMA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MICRHEMA_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Validar credencial de deploy do Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT_JSON não configurado."
            exit 1
          fi

      - name: Autenticar no Firebase/Google Cloud
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
          project_id: mic-rhema

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar regras do Firestore
        run: firebase deploy --only firestore:rules --project mic-rhema --non-interactive

      - name: Publicar notificações do Firebase
        run: firebase deploy --only functions --project mic-rhema --non-interactive

      - name: Remover arquivos temporários de configuração
        if: always()
        run: rm -f release.keystore .env app/google-services.json


      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: aplicativo-pronto
          path: '**/*.apk'

      - name: Extrair Versão e Preparar APK
        id: prep
        run: |
          source version.properties
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${AUTO_BUILD_NUMBER}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          
          # Encontrar o APK gerado
          APK_PATH=$(find . -name "*.apk" | grep release | head -n 1)
          NEW_APK_NAME="MIC-Rhema-v${VERSION_NAME}.apk"
          cp "$APK_PATH" "$NEW_APK_NAME"
          echo "APK_PATH=$NEW_APK_NAME" >> $GITHUB_ENV

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: MicRhema ${{ env.VERSION_NAME }}
          files: ${{ env.APK_PATH }}
          make_latest: true

      - name: Notificar nova atualização para todos os aparelhos
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.google-auth.outputs.credentials_file_path }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --project=mic-rhema >/dev/null
          FCM_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          RELEASE_URL="https://github.com/bichocutela/Mic-RHEMA-Ia-Studio-Google/releases/tag/v${VERSION_NAME}"
          PAYLOAD=$(jq -n \
            --arg title "Tem atualização nova!" \
            --arg body "O MIC Rhema ${VERSION_NAME} já está disponível. Toque para conferir." \
            --arg version "${VERSION_NAME}" \
            --arg url "$RELEASE_URL" \
            '{message:{topic:"all_users",notification:{title:$title,body:$body},data:{category:"content_updates",version:$version,url:$url}}}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${FCM_ACCESS_TOKEN}" \
            -H "Content-Type: application/json; UTF-8" \
            "https://fcm.googleapis.com/v1/projects/mic-rhema/messages:send" \
            --data "$PAYLOAD"

name: Inspect Badges Block 2
on:
  push:
    branches: [fix/badges-hd-block2]
    paths: ['.github/workflows/inspect-badges-block2.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar assets 13 a 17
        run: |
          set -e
          mkdir -p /tmp/b2
          for n in 13 14 15 16 17; do
            f="app/src/main/res/drawable-nodpi/profile_emblem_level_${n}.webp"
            echo "=== NIVEL $n ==="
            file "$f"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,pix_fmt -of default=nw=1 "$f"
            ffmpeg -v error -y -i "$f" -vf "scale=180:180:force_original_aspect_ratio=decrease,pad=190:190:(ow-iw)/2:(oh-ih)/2:white" -frames:v 1 "/tmp/b2/$n.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: block2-contact
          path: /tmp/b2

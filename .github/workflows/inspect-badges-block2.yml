name: Inspect Badges Block 2
on:
  push:
    branches: [fix/badges-hd-block2]
    paths: ['.github/workflows/inspect-badges-block2.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas de imagem
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
      - name: Inspecionar assets 13 a 17
        run: |
          set -e
          mkdir -p /tmp/b2
          for n in 13 14 15 16 17; do
            f="app/src/main/res/drawable-nodpi/profile_emblem_level_${n}.webp"
            echo "=== NIVEL $n ==="
            webpinfo "$f" | grep -E 'Canvas size|Width|Height|Alpha' || true
            dwebp "$f" -o "/tmp/b2/$n.png" >/dev/null
            convert "/tmp/b2/$n.png" -thumbnail '180x180>' -background white -gravity center -extent 190x190 "/tmp/b2/${n}_thumb.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: block2-contact
          path: /tmp/b2/*_thumb.png

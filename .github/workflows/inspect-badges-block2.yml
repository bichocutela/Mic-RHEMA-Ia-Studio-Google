name: Inspect Badges Block 2
on:
  push:
    branches: [fix/badges-hd-block2]
    paths: ['.github/workflows/inspect-badges-block2.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar assets 13 a 17
        run: |
          set -e
          mkdir -p /tmp/b2
          for n in 13 14 15 16 17; do
            f="app/src/main/res/drawable-nodpi/profile_emblem_level_${n}.webp"
            echo "=== NIVEL $n ==="
            file "$f"
            identify "$f" || true
            convert "$f[0]" -thumbnail '180x180>' -background white -gravity center -extent 190x190 "/tmp/b2/$n.png"
          done
          convert /tmp/b2/13.png /tmp/b2/14.png /tmp/b2/15.png /tmp/b2/16.png /tmp/b2/17.png +append block2-contact.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: block2-contact
          path: block2-contact.jpg

name: Process Badges Block 2
on:
  push:
    branches: [fix/badges-hd-block2]
    paths: ['.github/workflows/inspect-badges-block2.yml']
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir nível 13 truncado e padronizar 14 a 17
        run: |
          python -m pip install --quiet pillow
          rm app/src/main/res/drawable-nodpi/profile_emblem_level_13.webp
          cat > app/src/main/res/drawable-nodpi/profile_emblem_level_13.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="1024dp" android:height="1024dp" android:viewportWidth="1024" android:viewportHeight="1024">
            <path android:fillColor="#00000000" android:strokeColor="#D89A16" android:strokeWidth="74" android:pathData="M512,104 A408,408 0,1 1,511.9 104"/>
            <path android:fillColor="#00000000" android:strokeColor="#FFF4C7" android:strokeWidth="32" android:pathData="M512,132 A380,380 0,1 1,511.9 132"/>
            <path android:fillColor="#00000000" android:strokeColor="#F6C84B" android:strokeWidth="12" android:pathData="M512,160 A352,352 0,1 1,511.9 160"/>
            <path android:fillColor="#FFD54F" android:pathData="M512,44 L536,118 L512,176 L488,118 Z M512,848 L536,906 L512,980 L488,906 Z M44,512 L118,488 L176,512 L118,536 Z M848,512 L906,488 L980,512 L906,536 Z"/>
            <path android:fillColor="#FFE082" android:pathData="M181,181 L236,205 L252,252 L205,236 Z M843,181 L819,236 L772,252 L788,205 Z M181,843 L205,788 L252,772 L236,819 Z M843,843 L788,819 L772,772 L819,788 Z"/>
            <path android:fillColor="#2196F3" android:strokeColor="#FFD54F" android:strokeWidth="12" android:pathData="M512,96 L546,130 L512,164 L478,130 Z M894,478 L928,512 L894,546 L860,512 Z M512,860 L546,894 L512,928 L478,894 Z M130,478 L164,512 L130,546 L96,512 Z"/>
            <path android:fillColor="#42A5F5" android:strokeColor="#F6C84B" android:strokeWidth="16" android:pathData="M512,802 L570,860 L512,938 L454,860 Z"/>
            <path android:fillColor="#F6C84B" android:pathData="M512,782 L526,838 L582,852 L526,866 L512,922 L498,866 L442,852 L498,838 Z"/>
          </vector>
          XML
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          root=Path('app/src/main/res/drawable-nodpi')
          p16=root/'profile_emblem_level_16.webp'; p17=root/'profile_emblem_level_17.webp'
          # Usuário confirmou que Chama do Espírito estava em 17: troca para 16.
          b16=p16.read_bytes(); b17=p17.read_bytes(); p16.write_bytes(b17); p17.write_bytes(b16)
          for level in range(14,18):
              p=root/f'profile_emblem_level_{level:02d}.webp'
              im=Image.open(p).convert('RGBA')
              bbox=im.getchannel('A').getbbox()
              if not bbox: raise SystemExit(f'Nível {level} sem conteúdo')
              c=im.crop(bbox); scale=min(920/c.width,920/c.height)
              c=c.resize((max(1,round(c.width*scale)),max(1,round(c.height*scale))),Image.Resampling.LANCZOS)
              rgb=c.convert('RGB').filter(ImageFilter.UnsharpMask(radius=1.4,percent=125,threshold=3)); rgb.putalpha(c.getchannel('A'))
              out=Image.new('RGBA',(1024,1024),(0,0,0,0)); out.alpha_composite(rgb,((1024-rgb.width)//2,(1024-rgb.height)//2))
              out.save(p,'WEBP',lossless=True,quality=100,method=6)
              chk=Image.open(p).convert('RGBA'); cb=chk.getchannel('A').getbbox()
              assert chk.size==(1024,1024)
              assert chk.getchannel('A').getextrema()[0]==0
              assert cb and min(cb[0],cb[1],1024-cb[2],1024-cb[3])>=45, (level,cb)
              print(level,cb)
          PY
      - name: Validar catálogo 13 a 17
        run: |
          python <<'PY'
          from pathlib import Path
          t=Path('app/src/main/java/com/aistudio/micrhema/BadgeCatalog.kt').read_text()
          expected=[('luz_do_mundo','Luz do Mundo'),('armadura_de_deus','Armadura de Deus'),('leao_de_juda','Leão de Judá'),('chama_do_espirito','Chama do Espírito'),('coroa_da_vida','Coroa da Vida')]
          pos=[]
          for i,n in expected:
              p=t.find(f'BiblicalBadge("{i}", "{n}"'); assert p>=0,n; pos.append(p)
          assert pos==sorted(pos)
          print('Ordem 13–17 validada; Chama do Espírito = nível 16')
          PY
      - name: Commitar bloco 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/profile_emblem_level_13.* app/src/main/res/drawable-nodpi/profile_emblem_level_{14,15,16,17}.webp
          git commit -m 'fix(badges): corrigir níveis 13 a 17 em 1024'
          git push origin HEAD:fix/badges-hd-block2

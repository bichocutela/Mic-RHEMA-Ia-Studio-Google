name: Implantar correcoes das notificacoes Firebase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firebase-functions/**
      - .github/workflows/deploy-firebase-notifications.yml
permissions:
  contents: read
concurrency:
  group: firebase-notifications-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Autenticar Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: mic-rhema
      - name: Instalar ferramentas
        run: |
          npm install -g firebase-tools
          npm install --prefix firebase-functions
          node --check firebase-functions/index.js
      - name: Verificar funcoes existentes
        continue-on-error: true
        run: firebase functions:list --project mic-rhema --non-interactive
      - name: Implantar correcoes
        run: firebase deploy --only functions --project mic-rhema --non-interactive
      - name: Conferir implantacao
        run: firebase functions:list --project mic-rhema --non-interactive

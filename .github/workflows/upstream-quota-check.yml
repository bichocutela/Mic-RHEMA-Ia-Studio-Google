name: Upstream quota resilience
on:
  pull_request:
    paths:
      - 'supabase/functions/discipulado-release/**'
      - 'supabase/functions/youtube-live/**'
      - 'supabase/functions/pwa-scheduled-notifications/**'
      - 'tests/upstream-quota.test.mjs'
      - 'tests/notification-policy.test.mjs'
      - '.github/workflows/upstream-quota-check.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/discipulado-release/**'
      - 'supabase/functions/youtube-live/**'
      - 'supabase/functions/pwa-scheduled-notifications/**'
      - 'tests/upstream-quota.test.mjs'
      - '.github/workflows/upstream-quota-check.yml'
permissions:
  contents: read
jobs:
  resilience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/upstream-quota.test.mjs tests/notification-policy.test.mjs supabase/functions/discipulado-release/tests/publishing.test.mjs

name: Integrar Compras XP no Perfil

on:
  push:
    branches: [feat/profile-xp-purchases]
    paths:
      - '.github/workflows/profile-xp-purchases-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-xp-purchases
          fetch-depth: 0

      - name: Integrar botão e ativação
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt')
          text = profile.read_text()
          old = '    var showAchievementProgress by remember { mutableStateOf(false) }\n'
          new = old + '    var showXpPurchases by remember { mutableStateOf(false) }\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('Estado de conquistas não encontrado')
              text = text.replace(old, new, 1)

          marker = '''            Spacer(modifier = Modifier.height(24.dp))

            ProfileField(
                label = "Nome completo",'''
          replacement = '''            Spacer(modifier = Modifier.height(16.dp))

            OutlinedButton(
                onClick = { showXpPurchases = true },
                modifier = Modifier.fillMaxWidth()
            ) {
                Icon(Icons.Default.ReceiptLong, contentDescription = null)
                Spacer(modifier = Modifier.width(8.dp))
                Text("Ver Compras XP", fontWeight = FontWeight.SemiBold)
            }

            Spacer(modifier = Modifier.height(24.dp))

            ProfileField(
                label = "Nome completo",'''
          if 'Text("Ver Compras XP"' not in text:
              if marker not in text:
                  raise SystemExit('Ponto de inserção do botão não encontrado')
              text = text.replace(marker, replacement, 1)

          dialog_marker = '''    if (showAchievementProgress) {
        AchievementProgressDialog('''
          dialog_replacement = '''    if (showXpPurchases) {
        XpPurchasesDialog(
            member = loggedInMember,
            onDismiss = { showXpPurchases = false }
        )
    }

    if (showAchievementProgress) {
        AchievementProgressDialog('''
          if 'XpPurchasesDialog(' not in text:
              if dialog_marker not in text:
                  raise SystemExit('Ponto de inserção do diálogo não encontrado')
              text = text.replace(dialog_marker, dialog_replacement, 1)
          profile.write_text(text)

          badge = Path('app/src/main/java/com/aistudio/micrhema/BadgeFrame.kt')
          b = badge.read_text()
          b = b.replace(
              'val hasPromiseFrame = XpRewardManager.isOwned(context, XpRewardManager.PROMISE_FRAME)',
              'val hasPromiseFrame = XpRewardManager.isActive(context, XpRewardManager.PROMISE_FRAME)',
              1
          )
          b = b.replace(
              'val hasReaderBadge = XpRewardManager.isOwned(context, XpRewardManager.READER_BADGE)',
              'val hasReaderBadge = XpRewardManager.isActive(context, XpRewardManager.READER_BADGE)',
              1
          )
          badge.write_text(b)
          PY

      - name: Restaurar configuração de build
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Compilar Android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Limpar temporários e workflow auxiliar
        run: |
          rm -f app/google-services.json .env
          rm -f .github/workflows/profile-xp-purchases-patch.yml

      - name: Commitar integração validada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt app/src/main/java/com/aistudio/micrhema/BadgeFrame.kt .github/workflows/profile-xp-purchases-patch.yml
          if git diff --cached --quiet; then
            echo 'Sem alterações adicionais.'
            exit 0
          fi
          git commit -m 'feat(profile): adicionar Compras XP com prévia e ativação'
          git push origin HEAD:feat/profile-xp-purchases

name: Admin Test User Setup

on:
  push:
    branches:
      - diag/xp-owner-110

permissions:
  contents: read

jobs:
  setup:
    name: Liberar emblemas da conta Teste
    runs-on: ubuntu-latest
    steps:
      - name: Localizar conta e liberar todos os emblemas
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TARGET_PHONE: "8499999999"
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$tmpdir/sa.json"
          client_email="$(jq -r '.client_email' "$tmpdir/sa.json")"
          jq -r '.private_key' "$tmpdir/sa.json" > "$tmpdir/key.pem"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          exp="$((now + 3600))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn \
            --arg iss "$client_email" \
            --arg scope 'https://www.googleapis.com/auth/datastore' \
            --arg aud 'https://oauth2.googleapis.com/token' \
            --argjson iat "$now" \
            --argjson exp "$exp" \
            '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}' | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$tmpdir/key.pem" | b64url)"
          assertion="${unsigned}.${signature}"

          token_json="$(curl -fsSL -X POST 'https://oauth2.googleapis.com/token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
            --data-urlencode "assertion=${assertion}")"
          access_token="$(printf '%s' "$token_json" | jq -r '.access_token // empty')"
          test -n "$access_token"

          base='https://firestore.googleapis.com/v1/projects/mic-rhema/databases/(default)/documents'
          query_phone() {
            local phone="$1"
            local body
            body="$(jq -cn --arg phone "$phone" '{structuredQuery:{from:[{collectionId:"acessos_pendentes"}],where:{fieldFilter:{field:{fieldPath:"phone"},op:"EQUAL",value:{stringValue:$phone}}},limit:20}}')"
            curl -fsSL -X POST "${base}:runQuery" \
              -H "Authorization: Bearer ${access_token}" \
              -H 'Content-Type: application/json' \
              -d "$body"
          }

          rows="$(query_phone "$TARGET_PHONE")"
          doc="$(printf '%s' "$rows" | jq -c '[.[] | select(.document) | .document][0] // empty')"
          if [ -z "$doc" ]; then
            rows="$(query_phone "55${TARGET_PHONE}")"
            doc="$(printf '%s' "$rows" | jq -c '[.[] | select(.document) | .document][0] // empty')"
          fi
          if [ -z "$doc" ]; then
            echo 'Conta Teste não encontrada.' >&2
            exit 2
          fi

          member_id="$(printf '%s' "$doc" | jq -r '.name | split("/") | last')"
          name="$(printf '%s' "$doc" | jq -r '.fields.name.stringValue // ""')"
          phone="$(printf '%s' "$doc" | jq -r '.fields.phone.stringValue // ""' | tr -cd '0-9')"
          if [[ ( ${#phone} -eq 12 || ${#phone} -eq 13 ) && "$phone" == 55* ]]; then phone="${phone:2}"; fi
          approved="$(printf '%s' "$doc" | jq -r '.fields.isApproved.booleanValue // false')"
          admin="$(printf '%s' "$doc" | jq -r '.fields.isAdmin.booleanValue // false')"
          lower_name="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | xargs)"

          test "$phone" = "$TARGET_PHONE"
          test "$lower_name" = 'teste'
          if [ "$approved" != 'true' ] && [ "$admin" != 'true' ]; then
            echo 'A conta Teste ainda não está aprovada.' >&2
            exit 3
          fi

          badges='["caminhante","semeador","discipulo","perseverante","estudante_rhema","mestre_da_palavra","guardiao_da_fe","semente_da_fe","caminho_da_promessa","escudo_da_fe","aguas_vivas","videira_verdadeira","luz_do_mundo","armadura_de_deus","leao_de_juda","chama_do_espirito","coroa_da_vida","asas_da_promessa","tabernaculo","arca_da_alianca","nova_jerusalem","gloria_eterna","primeira_oracao","leitor_da_palavra","coracao_grato","constante","certificado_ibr"]'
          now_ms="$(( $(date +%s) * 1000 ))"
          patch="$(jq -cn --argjson ids "$badges" --arg now "$now_ms" '{fields:{unlockedBadgeIds:{arrayValue:{values:($ids|map({stringValue:.}))}},updatedAt:{integerValue:$now}}}')"

          access_url="${base}/acessos_pendentes/${member_id}?updateMask.fieldPaths=unlockedBadgeIds&updateMask.fieldPaths=updatedAt"
          curl -fsSL -X PATCH "$access_url" \
            -H "Authorization: Bearer ${access_token}" \
            -H 'Content-Type: application/json' \
            -d "$patch" >/dev/null

          user_url="${base}/users/${member_id}"
          user_status="$(curl -sS -o "$tmpdir/user.json" -w '%{http_code}' -H "Authorization: Bearer ${access_token}" "$user_url")"
          if [ "$user_status" = '200' ]; then
            curl -fsSL -X PATCH "${user_url}?updateMask.fieldPaths=unlockedBadgeIds&updateMask.fieldPaths=updatedAt" \
              -H "Authorization: Bearer ${access_token}" \
              -H 'Content-Type: application/json' \
              -d "$patch" >/dev/null
          fi

          printf 'MEMBER_ID=%s\n' "$member_id"
          printf 'NAME=%s\n' "$name"
          printf 'PHONE_LAST4=%s\n' "${phone: -4}"
          printf 'APPROVED=%s\n' "$approved"
          printf 'UNLOCKED_BADGES=%s\n' "$(printf '%s' "$badges" | jq 'length')"

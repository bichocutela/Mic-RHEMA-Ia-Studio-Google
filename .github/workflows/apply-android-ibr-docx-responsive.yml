name: Apply Android IBR DOCX Responsive Patch

on:
  push:
    branches:
      - feat/android-ibr-docx-responsive
    paths:
      - '.github/workflows/apply-android-ibr-docx-responsive.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: feat/android-ibr-docx-responsive
          fetch-depth: 0

      - name: Aplicar alterações guardadas
        run: python3 tools/apply_android_ibr_docx_responsive.py

      - name: Verificar diff
        run: |
          git diff --check
          git status --short

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Restaurar google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          jq empty app/google-services.json

      - name: Configurar variáveis públicas do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cp .env.example .env
          if [ -n "$SUPABASE_URL" ]; then sed -i "s|^SUPABASE_URL=.*|SUPABASE_URL=$SUPABASE_URL|" .env; fi
          if [ -n "$SUPABASE_ANON_KEY" ]; then sed -i "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY|" .env; fi

      - name: Compilar Android de validação
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Limpar temporários e automação de patch
        if: success()
        run: |
          rm -f app/google-services.json .env
          rm -f tools/apply_android_ibr_docx_responsive.py
          rm -f .github/workflows/apply-android-ibr-docx-responsive.yml

      - name: Commitar alterações validadas
        if: success()
        run: |
          git config user.name "bicho cutela"
          git config user.email "haydendanex@gmail.com"
          git add -A
          git commit -m "feat: add Android IBR DOCX and responsive admin layout"
          git push origin HEAD:feat/android-ibr-docx-responsive

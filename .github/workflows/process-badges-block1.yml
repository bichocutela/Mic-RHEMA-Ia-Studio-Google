name: Process Badges Block 1

on:
  push:
    branches: [fix/badges-hd-block1]
    paths:
      - '.github/workflows/process-badges-block1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/badges-hd-block1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Padronizar níveis 8 a 12 em 1024x1024
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          root = Path('app/src/main/res/drawable-nodpi')
          for level in range(8, 13):
              path = root / f'profile_emblem_level_{level:02d}.webp'
              image = Image.open(path).convert('RGBA')
              bbox = image.getchannel('A').getbbox()
              if not bbox:
                  raise SystemExit(f'Emblema {level} sem conteúdo visível')
              content = image.crop(bbox)
              scale = min(920 / content.width, 920 / content.height)
              target = (max(1, round(content.width * scale)), max(1, round(content.height * scale)))
              content = content.resize(target, Image.Resampling.LANCZOS)
              rgb = content.convert('RGB').filter(ImageFilter.UnsharpMask(radius=1.4, percent=125, threshold=3))
              rgb.putalpha(content.getchannel('A'))
              canvas = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
              canvas.alpha_composite(rgb, ((1024-rgb.width)//2, (1024-rgb.height)//2))
              canvas.save(path, 'WEBP', lossless=True, quality=100, method=6)
              check = Image.open(path).convert('RGBA')
              cb = check.getchannel('A').getbbox()
              if check.size != (1024,1024): raise SystemExit(f'Emblema {level}: resolução incorreta')
              if check.getchannel('A').getextrema()[0] != 0: raise SystemExit(f'Emblema {level}: sem transparência')
              if cb is None or min(cb[0],cb[1],1024-cb[2],1024-cb[3]) < 45: raise SystemExit(f'Emblema {level}: margem insuficiente {cb}')
              print(f'Nível {level}: 1024x1024 RGBA bbox={cb} bytes={path.stat().st_size}')
          PY

      - name: Validar ordem do catálogo 8 a 12
        run: |
          python <<'PY'
          from pathlib import Path
          text=Path('app/src/main/java/com/aistudio/micrhema/BadgeCatalog.kt').read_text()
          expected=[('semente_da_fe','Semente da Fé'),('caminho_da_promessa','Caminho da Promessa'),('escudo_da_fe','Escudo da Fé'),('aguas_vivas','Águas Vivas'),('videira_verdadeira','Videira Verdadeira')]
          positions=[]
          for badge_id,name in expected:
              pos=text.find(f'BiblicalBadge("{badge_id}", "{name}"')
              if pos < 0: raise SystemExit(f'Catálogo sem {name}')
              positions.append(pos)
          if positions != sorted(positions): raise SystemExit('Ordem 8–12 incorreta')
          print('Ordem 8–12 validada')
          PY

      - name: Commitar bloco 1 processado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/drawable-nodpi/profile_emblem_level_{08,09,10,11,12}.webp
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração de asset.'
          else
            git commit -m 'fix(badges): padronizar níveis 8 a 12 em 1024'
            git push origin HEAD:fix/badges-hd-block1
          fi

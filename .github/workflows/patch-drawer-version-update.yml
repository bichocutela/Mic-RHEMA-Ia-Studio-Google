name: Apply drawer version footer patch

on:
  push:
    branches:
      - feat/drawer-version-update-status
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/drawer-version-update-status

      - name: Apply patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main_path = Path("app/src/main/java/com/aistudio/micrhema/MainActivity.kt")
          worker_path = Path("app/src/main/java/com/aistudio/micrhema/AppUpdateWorker.kt")

          main = main_path.read_text(encoding="utf-8")
          group_start = main.find('                groupedItems.forEach { (groupName, items) ->')
          if group_start < 0:
              raise SystemExit("Não encontrei groupedItems.forEach no drawer")
          drawer_tail = "                    HorizontalDivider(color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.08f))\n                }\n            }\n        }\n    ) {"
          tail_pos = main.find(drawer_tail, group_start)
          if tail_pos < 0:
              raise SystemExit("Não encontrei o final do drawer para inserir a versão")
          footer = "                    HorizontalDivider(color = MaterialTheme.colorScheme.onSurface.copy(alpha = 0.08f))\n                }\n\n                DrawerVersionFooter(\n                    onOpenUpdate = {\n                        navController.navigate(Screen.About.route) {\n                            popUpTo(navController.graph.startDestinationId)\n                            launchSingleTop = true\n                        }\n                        scope.launch { drawerState.close() }\n                    }\n                )\n            }\n        }\n    ) {"
          main = main[:tail_pos] + footer + main[tail_pos + len(drawer_tail):]
          main_path.write_text(main, encoding="utf-8")

          worker = worker_path.read_text(encoding="utf-8")
          old_admin = "        val hasAdminSession = adminAuthenticatedState.value || loggedInMemberState.value?.isAdmin == true\n        if (hasAdminSession) return Result.success()\n\n        return when (val result = UpdateChecker.checkForUpdates(BuildConfig.VERSION_NAME)) {"
          new_admin = "        val hasAdminSession = adminAuthenticatedState.value || loggedInMemberState.value?.isAdmin == true\n\n        return when (val result = UpdateChecker.checkForUpdates(BuildConfig.VERSION_NAME)) {"
          if old_admin not in worker:
              raise SystemExit("Bloco de sessão ADM do AppUpdateWorker não encontrado")
          worker = worker.replace(old_admin, new_admin, 1)

          old_success = "                val info = result.info\n                if (!info.updateAvailable) return Result.success()\n\n                val prefs = applicationContext.getSharedPreferences("
          new_success = "                val info = result.info\n                AppUpdateStatusStore.persist(applicationContext, info)\n                if (!info.updateAvailable) return Result.success()\n\n                // O ADM continua recebendo aviso imediato via FCM; o ciclo de 12h apenas\n                // atualiza o estado visual do drawer para qualquer sessão.\n                if (hasAdminSession) return Result.success()\n\n                val prefs = applicationContext.getSharedPreferences("
          if old_success not in worker:
              raise SystemExit("Bloco de sucesso do AppUpdateWorker não encontrado")
          worker = worker.replace(old_success, new_success, 1)
          worker_path.write_text(worker, encoding="utf-8")
          PY

          git diff --check
          git status --short

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aistudio/micrhema/MainActivity.kt
          git add app/src/main/java/com/aistudio/micrhema/AppUpdateWorker.kt
          git commit -m "feat: mostrar versão e atualização no drawer"
          git push origin HEAD

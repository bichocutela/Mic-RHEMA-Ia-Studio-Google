name: Patch EPUB storage support

on:
  push:
    branches:
      - feat/internal-docx-epub-xodo-share
    paths:
      - '.github/workflows/patch-epub-storage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar suporte EPUB ao armazenamento
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1, encontrado {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          storage = 'app/src/main/java/com/aistudio/micrhema/StorageManager.kt'
          replace_once(storage,
              '    private const val DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"\n',
              '    private const val DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"\n    private const val EPUB_MIME = "application/epub+zip"\n')
          replace_once(storage,
              '        DOCX_MIME -> ".docx"\n',
              '        DOCX_MIME -> ".docx"\n        EPUB_MIME -> ".epub"\n')
          replace_once(storage,
              '                "application/pdf", DOCX_MIME,\n',
              '                "application/pdf", DOCX_MIME, EPUB_MIME,\n')

          gateway = 'supabase/functions/storage-gateway/index.ts'
          replace_once(gateway,
              'const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";\n',
              'const DOCX_MIME = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";\nconst EPUB_MIME = "application/epub+zip";\n')
          replace_once(gateway,
              '          "application/pdf", DOCX_MIME,\n',
              '          "application/pdf", DOCX_MIME, EPUB_MIME,\n')
          replace_once(gateway,
              '  if (mimeType === DOCX_MIME) return "docx";\n',
              '  if (mimeType === DOCX_MIME) return "docx";\n  if (mimeType === EPUB_MIME) return "epub";\n')

          Path('.github/workflows/patch-epub-storage.yml').unlink()
      - name: Verificar patch
        run: |
          grep -q 'EPUB_MIME = "application/epub+zip"' app/src/main/java/com/aistudio/micrhema/StorageManager.kt
          grep -q 'EPUB_MIME = "application/epub+zip"' supabase/functions/storage-gateway/index.ts
          grep -q 'EPUB_MIME -> ".epub"' app/src/main/java/com/aistudio/micrhema/StorageManager.kt
          git diff --check
      - name: Commitar na branch isolada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: allow EPUB in shared media storage"
          git push origin HEAD:feat/internal-docx-epub-xodo-share

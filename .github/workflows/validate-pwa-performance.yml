name: Validar desempenho PWA

on:
  push:
    branches:
      - perf/pwa-startup-home

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /Mic-RHEMA-Ia-Studio-Google/
      VITE_SUPABASE_URL: https://cwphbkdtorfpgmnlafqb.supabase.co
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pwa/pnpm-lock.yaml
      - name: Instalar dependências
        working-directory: pwa
        run: pnpm install --frozen-lockfile
      - name: Validar TypeScript
        working-directory: pwa
        run: pnpm check
      - name: Gerar build de produção
        working-directory: pwa
        run: pnpm build
      - name: Medir pacote inicial
        working-directory: pwa
        run: |
          echo "=== ARQUIVOS DO BUILD ==="
          find dist/public -maxdepth 2 -type f -printf '%s %p\n' | sort -nr | head -40
          echo "=== TOTAL ==="
          du -sh dist/public

name: Aplicar painel de progresso Android

on:
  push:
    branches: [feat/android-achievement-progress-dialog]
    paths:
      - '.github/workflows/apply-achievement-progress-dialog.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-achievement-progress-dialog

      - name: Tornar progresso clicável e abrir painel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt')
          text = path.read_text()

          replacements = [
              (
                  '    var showBadgePicker by remember { mutableStateOf(false) }\n    var focusedBadgeId by remember { mutableStateOf<String?>(null) }',
                  '    var showBadgePicker by remember { mutableStateOf(false) }\n    var showAchievementProgress by remember { mutableStateOf(false) }\n    var focusedBadgeId by remember { mutableStateOf<String?>(null) }'
              ),
              (
                  '            Card(\n                modifier = Modifier.fillMaxWidth(),\n                colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer.copy(alpha = 0.35f)),\n                shape = RoundedCornerShape(20.dp)\n            ) {',
                  '            Card(\n                modifier = Modifier\n                    .fillMaxWidth()\n                    .clickable { showAchievementProgress = true },\n                colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.primaryContainer.copy(alpha = 0.35f)),\n                shape = RoundedCornerShape(20.dp)\n            ) {'
              ),
              (
                  '    if (showAvatarPreview) {',
                  '    if (showAchievementProgress) {\n        AchievementProgressDialog(\n            progress = badgeProgress,\n            onDismiss = { showAchievementProgress = false }\n        )\n    }\n\n    if (showAvatarPreview) {'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Replacement target found {count} times instead of 1: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validar alteração esperada
        run: |
          grep -q 'showAchievementProgress' app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt
          grep -q 'AchievementProgressDialog' app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt
          grep -q 'clickable { showAchievementProgress = true }' app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt

      - name: Commit da alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/aistudio/micrhema/ProfileScreen.kt
          git commit -m 'feat(android): abrir detalhes das missões no perfil'
          git push origin HEAD:feat/android-achievement-progress-dialog

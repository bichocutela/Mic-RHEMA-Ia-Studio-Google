<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#103A4C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MIC Rhema" />
    <meta name="description" content="MIC Rhema — Palavra, comunhão e formação na palma da mão." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/mic-rhema-android-logo.png" />
    <link rel="icon" href="%BASE_URL%brand/mic-rhema-android-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
    <title>MIC Rhema</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (() => {
        const fixAdminInputs = () => {
          document.querySelectorAll('form.auth-dialog').forEach((form) => {
            const heading = form.querySelector('h2');
            if (!heading || heading.textContent?.trim() !== 'Acesso administrativo') return;
            const inputs = form.querySelectorAll('input');
            const username = inputs.item(0);
            const password = inputs.item(1);
            if (username) {
              username.setAttribute('inputmode', 'text');
              username.setAttribute('autocomplete', 'username');
              username.setAttribute('autocapitalize', 'none');
              username.setAttribute('spellcheck', 'false');
            }
            if (password) {
              password.setAttribute('inputmode', 'text');
              password.setAttribute('autocomplete', 'current-password');
            }
          });
        };
        new MutationObserver(fixAdminInputs).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', fixAdminInputs);
      })();
    </script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
